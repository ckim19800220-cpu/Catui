<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Catui 문서</title>
<link rel="icon" href="{{dist}}/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="{{dist}}/catui.min.css">
<link rel="stylesheet" href="{{dist}}/docs.min.css">
<script>try{var t=(JSON.parse(localStorage.getItem("catui:docs")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body class="Catui_dk-body">
<!-- Catui 기본 스타일(리셋·링크·글꼴)은 루트 클래스 안에서만 적용되므로 Catui_site로 감싼다 -->
<div class="Catui_site Catui_dk Catui_dk-blank" data-catui-dk>
{{content}}
</div>
<script src="{{dist}}/catui.min.js"></script>
<script src="{{dist}}/catdocs.min.js"></script>
{{scripts}}
</body>
</html>
