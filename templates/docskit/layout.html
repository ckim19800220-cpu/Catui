<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} · Catui 문서</title>
<link rel="icon" href="{{dist}}/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="{{dist}}/catui.min.css">
<link rel="stylesheet" href="{{dist}}/docs.min.css">
<!-- 깜빡임 방지: 저장된 테마를 그리기 전에 적용 (CSP로 인라인 스크립트를 막는다면 지워도 됩니다 — catdocs.js가 곧바로 적용) -->
<script>try{var t=(JSON.parse(localStorage.getItem("catui:docs")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body class="Catui_dk-body">
<a class="Catui_skip" href="#dk-main">본문으로 이동</a>
<div class="Catui_site Catui_dk" data-catui-dk data-page="{{page}}">
  <header class="Catui_dk-head">
    <div class="Catui_dk-head-in">
      <a class="Catui_dk-brand" href="index.html" aria-label="Catui 문서 홈"><span class="Catui_dk-logo" aria-hidden="true">{{icon:book-open:20}}</span><b>Catui <span>Docs</span></b></a>
      <nav class="Catui_dk-nav" aria-label="사이트">{{topnav}}</nav>
      <form class="Catui_dk-search" action="search.html" role="search" data-catui-dk-search>
        <div class="Catui_search">{{icon:search}}<label class="Catui_clip" for="dk-q">문서 검색</label><input class="Catui_input" id="dk-q" name="q" type="search" placeholder="문서 검색 (초성 가능)" autocomplete="off" enterkeyhint="search"></div>
      </form>
      <div class="Catui_dk-head-acts">
        <a class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon Catui_dk-only-sm" href="search.html" aria-label="검색">{{icon:search:18}}</a>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-catui-dk-theme aria-label="어두운 화면으로">{{icon:moon:18}}</button>
      </div>
    </div>
  </header>
  <main class="Catui_dk-main" id="dk-main" tabindex="-1">
{{content}}
  </main>
  <footer class="Catui_dk-foot">
    <div class="Catui_dk-foot-in">
      <nav aria-label="문서 안내">{{foot}}</nav>
      <p>Catui Docs는 catui 위에 얹는 문서·블로그 사이트 키트의 견본입니다. 글·저자·버전은 모두 가상 데이터입니다.</p>
      <p>© 2026 Catui · Catui {{version}} · MIT License</p>
    </div>
  </footer>
</div>
<script src="{{dist}}/catui.min.js"></script>
<script src="{{dist}}/catdocs.min.js"></script>
{{scripts}}
</body>
</html>
