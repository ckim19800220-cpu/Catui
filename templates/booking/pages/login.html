<!-- title: 로그인 | layout: blank -->
<main class="Catui_card Catui_bk-blank-card"><form class="Catui_card-b Catui_vstack Catui_gap-4" id="lg-form" data-catui-form data-catui-filter="bk-login" novalidate>
  <a class="Catui_bk-brand" href="index.html"><span class="Catui_logo" aria-hidden="true">{{icon:calendar-check}}</span><b>Catui <span>예약</span></b></a>
  <div><h1 class="Catui_h2">로그인</h1><p class="Catui_help">내 예약 확인·변경·취소는 로그인 후 할 수 있어요</p></div>
  <div class="Catui_banner Catui_banner-danger" role="alert" id="lg-err" hidden>{{icon:alert-circle:16}}<span>휴대전화 또는 비밀번호가 맞지 않습니다. (예제: 010-1234-5678 / catui1234)</span></div>
  <div class="Catui_field"><label class="Catui_label" for="lg-phone">휴대전화</label><input class="Catui_input" id="lg-phone" name="phone" type="tel" inputmode="tel" autocomplete="username" value="010-1234-5678" data-catui-verify="required|phone"></div>
  <div class="Catui_field"><label class="Catui_label" for="lg-pw">비밀번호</label><input class="Catui_input" id="lg-pw" name="pw" type="password" autocomplete="current-password" data-catui-verify="required"></div>
  <label class="Catui_choice" for="lg-keep"><input class="Catui_clip" type="checkbox" id="lg-keep" name="keep"><span class="Catui_cbx">{{icon:check:12}}</span>로그인 상태 유지</label>
  <button class="Catui_btn Catui_btn-lg Catui_btn-primary" type="submit">로그인</button>
  <p class="Catui_help">예약 번호만 있다면 <a class="Catui_link" href="detail.html?no=BK-261101-0012">비회원 예약 조회</a> · <a class="Catui_link" href="index.html">처음으로</a></p>
</form></main>
<script>
catui.use(['form'], function (form) {
  form.on('submit(bk-login)', function (d) { var ok = d.field.phone.replace(/-/g, '') === '01012345678' && d.field.pw === 'catui1234'; document.getElementById('lg-err').hidden = ok; if (ok) location.href = 'mine.html'; else document.getElementById('lg-pw').select(); return false; });
});
</script>
