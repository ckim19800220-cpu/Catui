<!-- title: 관리자 일정표 | nav: admin -->
<section class="Catui_bk-sec" data-catui-bk-admin aria-labelledby="ad-h">
  <div class="Catui_bk-sec-h"><h1 class="Catui_h2" id="ad-h">관리자 일정표 <small class="Catui_bk-muted">강남점</small></h1>
    <div class="Catui_bk-chips" role="group" aria-label="보기">
      <button class="Catui_bk-chip" type="button" data-view="day" aria-pressed="true">{{icon:calendar}}일</button>
      <button class="Catui_bk-chip" type="button" data-view="week" aria-pressed="false">{{icon:calendar-week}}주</button>
    </div>
  </div>
  <ul class="Catui_bk-stats" data-stats aria-label="이 기간 수치"></ul>
  <div class="Catui_bk-toolbar">
    <h2 data-title aria-live="polite">일정</h2>
    <div class="Catui_bk-acts">
      <button class="Catui_btn Catui_btn-sm Catui_btn-secondary Catui_btn-icon" type="button" data-move="-1" aria-label="이전">{{icon:chevron-left:18}}</button>
      <button class="Catui_btn Catui_btn-sm Catui_btn-secondary" type="button" data-move="0">오늘</button>
      <button class="Catui_btn Catui_btn-sm Catui_btn-secondary Catui_btn-icon" type="button" data-move="1" aria-label="다음">{{icon:chevron-right:18}}</button>
    </div>
    <div class="Catui_field" data-staff-wrap hidden><label class="Catui_clip" for="ad-staff">직원</label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="ad-staff" data-staff></select>{{icon:chevron-down}}</div></div>
  </div>
  <ul class="Catui_bk-keys" aria-label="예약 블록 상태">
    <li><span class="Catui_bk-key" data-k="on" aria-hidden="true"></span>확정(실선)</li>
    <li><span class="Catui_bk-key" aria-hidden="true">…</span>확인 대기(점선 테두리)</li>
    <li><span class="Catui_bk-key" data-k="taken" aria-hidden="true"></span>노쇼 · 취소(빗금)</li>
    <li>겹친 예약은 나란히 놓고 “겹침” 글자</li>
  </ul>
  <div data-board><p class="Catui_help">일정을 불러오는 중입니다…</p></div>
</section>
