<!-- title: 전체 주문 | crumb: 커머스 / 주문 / 전체 주문 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">주문</h1><p>오늘 처리할 주문 18건</p></div>
  <div class="Catui_actions"><button class="Catui_btn Catui_btn-md Catui_btn-secondary" type="button" id="od-csv">{{icon:download}}CSV</button></div>
</div>
<section class="Catui_adm-stats" aria-label="주문 상태">
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">결제 대기</span><span class="Catui_stat-value" data-od-count="결제 대기">6</span></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">출고 준비</span><span class="Catui_stat-value" data-od-count="출고 준비">12</span></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">배송 중</span><span class="Catui_stat-value" data-od-count="배송 중">41</span></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">교환·반품</span><span class="Catui_stat-value">3</span></div></article>
</section>
<article class="Catui_card">
  <div class="Catui_card-b Catui_vstack Catui_gap-4">
    <div class="Catui_tabs" id="od-tabs">
      <input class="Catui_clip" type="radio" name="od-tab" id="od-t0" value="" checked><label class="Catui_tab" for="od-t0">전체</label>
      <input class="Catui_clip" type="radio" name="od-tab" id="od-t1" value="결제 대기"><label class="Catui_tab" for="od-t1">결제 대기</label>
      <input class="Catui_clip" type="radio" name="od-tab" id="od-t2" value="출고 준비"><label class="Catui_tab" for="od-t2">출고 준비</label>
      <input class="Catui_clip" type="radio" name="od-tab" id="od-t3" value="배송 중"><label class="Catui_tab" for="od-t3">배송 중</label>
      <input class="Catui_clip" type="radio" name="od-tab" id="od-t4" value="배송 완료"><label class="Catui_tab" for="od-t4">배송 완료</label>
    </div>
    <div id="od-table" data-catui-filter="od-table"></div>
  </div>
</article>
<script>
catui.use(['table', 'util'], function (table, util) {
  var names = ['김하늘', '이준', '박서연', '최민', '정수아', '강도현', '윤지호', '한소리'], ST = ['결제 대기', '출고 준비', '배송 중', '배송 완료'], K = { '결제 대기': 'warning', '출고 준비': 'neutral', '배송 중': 'info', '배송 완료': 'success' };
  // 모의 데이터: data/orders.json (동적 표와 같은 주문) — 결제 대기는 출고 준비 전 단계로 표시
  catui.admin.data('orders').then(function (all) {
  var rows = all.slice(0, 30).map(function (r, i) { return { id: r.id, customer: r.customer, qty: 1 + (i % 3), amount: r.amount, status: r.status === '취소' ? '출고 준비' : r.status, pay: i % 3 ? '카드' : '간편결제', date: r.date.slice(5, 10).replace('-', '/') }; });
  // 상태별 건수는 표에 나오는 주문에서 계산 (숫자가 표와 항상 맞게)
  document.querySelectorAll('[data-od-count]').forEach(function (el) { el.textContent = rows.filter(function (r) { return r.status === el.dataset.odCount; }).length; });
  table.render({ elem: '#od-table', id: 'od-table', data: rows, page: true, limit: 8, caption: '주문 목록',
    cols: [{ field: 'id', title: '주문 번호', sort: true, templet: function (r) { return catui.html`<a href="order-detail.html">#${r.id}</a>`; } }, { field: 'date', title: '날짜' }, { field: 'customer', title: '고객' }, { field: 'qty', title: '수량', align: 'right' }, { field: 'pay', title: '결제' },
      { field: 'amount', title: '금액', sort: true, align: 'right', templet: function (r) { return util.number(r.amount) + '원'; } },
      { field: 'status', title: '상태', templet: function (r) { return catui.html`<span class="Catui_pill Catui_pill-${K[r.status]}"><i class="Catui_dot"></i>${r.status}</span>`; } }] });
  document.getElementById('od-tabs').addEventListener('change', function (e) { var v = e.target.value; table.reload('od-table', { data: rows.filter(function (r) { return !v || r.status === v; }) }); });
  document.getElementById('od-csv').addEventListener('click', function () { table.exportFile('od-table', '주문.csv'); });
  });
});
</script>
