<!-- title: 파일 | crumb: 앱 / 파일 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">파일</h1><p>500GB 중 341GB 사용</p></div>
  <div class="Catui_actions">
    <div class="Catui_segment" role="radiogroup" aria-label="보기 방식">
      <input class="Catui_clip" type="radio" name="fl-view" id="fl-v1" value="list" checked><label for="fl-v1">목록</label>
      <input class="Catui_clip" type="radio" name="fl-view" id="fl-v2" value="grid"><label for="fl-v2">격자</label>
    </div>
    <label class="Catui_btn Catui_btn-md Catui_btn-primary">{{icon:upload}}올리기<input class="Catui_clip" type="file" id="fl-up" multiple></label>
  </div>
</div>

<div class="Catui_grid">
  <aside class="Catui_card Catui_span-3" aria-label="폴더">
    <div class="Catui_card-b">
      <nav class="Catui_list" aria-label="폴더" id="fl-folders">
        <a class="Catui_list-item" href="#all" aria-current="page" data-folder="">{{icon:folder}}전체<span class="Catui_list-meta">12</span></a>
        <a class="Catui_list-item" href="#doc" data-folder="문서">{{icon:file-text}}문서<span class="Catui_list-meta">5</span></a>
        <a class="Catui_list-item" href="#img" data-folder="이미지">{{icon:image}}이미지<span class="Catui_list-meta">4</span></a>
        <a class="Catui_list-item" href="#sheet" data-folder="표">{{icon:table}}표<span class="Catui_list-meta">3</span></a>
      </nav>
      <div class="Catui_vstack Catui_gap-1" style="margin-top:var(--Catui_space-5)">
        <div class="Catui_prog-label"><span>사용량</span><span class="Catui_num">68%</span></div>
        <div class="Catui_meter" role="img" aria-label="저장 공간 68퍼센트 사용"><i style="width:68%"></i></div>
      </div>
    </div>
  </aside>
  <section class="Catui_card Catui_span-9" aria-labelledby="fl-t">
    <header class="Catui_card-h"><span id="fl-t">전체</span> <span class="Catui_adm-card-meta" id="fl-n"></span>
      <span class="Catui_card-tools"><span class="Catui_search">{{icon:search}}<label class="Catui_clip" for="fl-q">파일 찾기</label><input class="Catui_input" id="fl-q" type="search" placeholder="파일 이름"></span></span></header>
    <div class="Catui_card-b"><div class="Catui_files" id="fl-list" role="list"></div></div>
  </section>
</div>
<script>
catui.use(['util', 'layer', 'dropdown'], function (util, layer) {
  // 모의 데이터: data/files.json
  catui.admin.data('files').then(function (files) {
  files = files.slice();
  var ICON = { 문서: 'file-text', 이미지: 'image', 표: 'table' };
  var box = document.getElementById('fl-list'), folder = '';
  var draw = function () {
    var q = document.getElementById('fl-q').value.trim();
    var shown = files.filter(function (f) { return (!folder || f.folder === folder) && (!q || f.name.indexOf(q) > -1); });
    document.getElementById('fl-n').textContent = shown.length + '개 · ' + util.fileSize(shown.reduce(function (a, f) { return a + f.size; }, 0));
    catui.mount(box, shown.length ? catui.html`${shown.map(function (f) { return catui.html`<div class="Catui_file" role="listitem"><span class="Catui_file-ico${[2, 3, 5].indexOf(f.tone) > -1 ? ' Catui_file-ico-' + f.tone : ''}">${catui.icon(ICON[f.folder], 16)}</span><span class="Catui_file-main"><span class="Catui_file-name">${f.name}</span><span class="Catui_file-meta">${util.fileSize(f.size)} · ${f.date} <span class="Catui_av Catui_av-xs" aria-hidden="true">${f.who}</span></span></span><span class="Catui_file-acts"><button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-act="down" data-id="${f.id}" aria-label="${f.name} 받기">${catui.icon('download', 16)}</button><button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-act="del" data-id="${f.id}" aria-label="${f.name} 지우기">${catui.icon('trash-2', 16)}</button></span></div>`; })}` : catui.html`<div class="Catui_empty">${catui.icon('folder-open', 16)}<p class="Catui_empty-title">파일이 없습니다</p></div>`);
  };
  document.getElementById('fl-folders').addEventListener('click', function (e) {
    var a = e.target.closest('[data-folder]'); if (!a) return; e.preventDefault();
    folder = a.dataset.folder; document.querySelectorAll('#fl-folders [data-folder]').forEach(function (x) { if (x === a) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
    document.getElementById('fl-t').textContent = a.textContent.replace(/\d+$/, '').trim(); draw();
  });
  document.querySelectorAll('[name=fl-view]').forEach(function (r) { r.addEventListener('change', function () { box.classList.toggle('Catui_adm-files-grid', r.value === 'grid' && r.checked); }); });
  document.getElementById('fl-q').addEventListener('input', draw);
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return; var f = files.find(function (x) { return x.id === b.dataset.id; });
    if (b.dataset.act === 'down') layer.msg(f.name + ' 내려받기를 시작합니다', { time: 1200 });
    else layer.confirm(catui.admin.josa(f.name, '을') + ' 지울까요?', { danger: true, okText: '지우기' }, function (i) { layer.close(i); files.splice(files.indexOf(f), 1); draw(); });
  });
  document.getElementById('fl-up').addEventListener('change', function (e) {
    [].slice.call(e.target.files).forEach(function (file, i) { files.unshift({ id: 'n' + Date.now() + i, name: file.name, folder: file.type.startsWith('image/') ? '이미지' : '문서', size: file.size, date: '방금', who: '김', tone: 4 }); });
    e.target.value = ''; draw(); layer.msg('올렸습니다', { icon: 'success' });
  });
  draw();
  });
});
</script>
