<!-- title: 프로젝트 상세 | crumb: 프로젝트 / 프로젝트 상세 -->
<header class="Catui_pagehead">
  <a class="Catui_pagehead-back" href="projects.html">{{icon:chevron-left}}프로젝트</a>
  <div class="Catui_pagehead-row"><h1 class="Catui_pagehead-title">11월 프로모션</h1><span class="Catui_pill Catui_pill-info"><i class="Catui_dot"></i>진행</span>
    <div class="Catui_pagehead-actions"><a class="Catui_btn Catui_btn-md Catui_btn-secondary" href="kanban.html">{{icon:kanban}}보드</a><button class="Catui_btn Catui_btn-md Catui_btn-primary" type="button">{{icon:plus}}할 일</button></div></div>
  <p class="Catui_pagehead-text" data-catui-adm-src="project-promo" data-catui-adm-text="summary">10월 20일 ~ 11월 11일 · 담당 김하늘 외 3명</p>
</header>

<section class="Catui_adm-stats" aria-label="프로젝트 요약">
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">진행률</span><span class="Catui_stat-value" data-catui-adm-src="project-promo" data-catui-adm-text="pct" data-catui-adm-format="percent">64%</span><div class="Catui_meter" role="img" aria-label="진행률"><i data-catui-adm-src="project-promo" id="pd-pct-bar" style="width:64%"></i></div></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">할 일</span><span class="Catui_stat-value" data-catui-adm-src="project-promo" data-catui-adm-text="tasksLabel">14 / 22</span><span class="Catui_adm-stat-sub">완료 / 전체</span></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">남은 기간</span><span class="Catui_stat-value" data-catui-adm-src="project-promo" data-catui-adm-text="leftLabel">9일</span><span class="Catui_adm-stat-sub" data-catui-adm-src="project-promo" data-catui-adm-text="openLabel">11월 11일 오픈</span></div></article>
  <article class="Catui_card"><div class="Catui_card-b Catui_stat"><span class="Catui_stat-label">예산</span><span class="Catui_stat-value" data-catui-adm-src="project-promo" data-catui-adm-text="budgetPct" data-catui-adm-format="percent">72%</span><span class="Catui_adm-stat-sub" data-catui-adm-src="project-promo" data-catui-adm-text="budgetLabel">1,080만 / 1,500만원</span></div></article>
</section>

<div class="Catui_grid">
  <article class="Catui_card Catui_span-8">
    <header class="Catui_card-h">일정</header>
    <div class="Catui_card-b"><div class="Catui_gantt-scroll"><div class="Catui_gantt" role="img" aria-label="프로젝트 일정: 기획 완료, 디자인 진행, 개발 진행, 검수 예정, 오픈 11월 11일">
      <div class="Catui_gantt-head"><span>단계</span><div class="Catui_gantt-scale"><span>10/20</span><span>10/24</span><span>10/28</span><span>11/1</span><span>11/5</span><span>11/9</span></div></div>
      <div data-catui-adm-src="project-promo" data-catui-adm-rows="phases"><template><div class="Catui_gantt-row"><span data-catui-adm-field="name"></span><div class="Catui_gantt-track"><i class="Catui_gantt-bar" data-catui-adm-class="Catui_gantt-bar-:tone" data-catui-adm-bool="hidden:milestone" data-catui-adm-attr="style:left:{left}%;width:{width}%"></i><i class="Catui_gantt-mile" data-catui-adm-bool="hidden:noMile" data-catui-adm-attr="style:left:{milestone}%"></i><i class="Catui_gantt-today" data-catui-adm-bool="hidden:noToday" data-catui-adm-attr="style:left:{todayPos}%"></i></div></div></template></div>
    </div></div></div>
  </article>
  <article class="Catui_card Catui_span-4">
    <header class="Catui_card-h">팀</header>
    <div class="Catui_card-b"><ul class="Catui_list Catui_list-flush" data-catui-adm-src="project-promo" data-catui-adm-rows="members"><template><li class="Catui_list-item"><span class="Catui_av Catui_av-sm" aria-hidden="true" data-catui-adm-field="name" data-catui-adm-format="initial"></span><span data-catui-adm-field="name"></span><span class="Catui_list-meta" data-catui-adm-field="meta"></span></li></template></ul></div>
  </article>

  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">이번 주 할 일</header>
    <div class="Catui_card-b"><div role="list" aria-label="이번 주 할 일" data-catui-adm-src="project-promo" data-catui-adm-rows="week">
      <template><label class="Catui_task" role="listitem"><input class="Catui_clip" type="checkbox" data-catui-adm-bool="checked:done"><span class="Catui_cbx">{{icon:check:12}}</span><i class="Catui_pri" data-catui-adm-class="Catui_pri-:priority" aria-hidden="true"></i><span><span data-catui-adm-field="title"></span><span class="Catui_clip" data-catui-adm-field="priorityNote"></span></span><span class="Catui_help" data-catui-adm-field="owner"></span></label></template>
    </div></div>
  </article>
  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">최근 기록</header>
    <div class="Catui_card-b"><div class="Catui_atl" data-catui-adm-src="project-promo" data-catui-adm-rows="log"><template><div class="Catui_atl-item"><span class="Catui_av Catui_av-sm" aria-hidden="true" data-catui-adm-field="who" data-catui-adm-format="initial"></span><div class="Catui_atl-main"><b data-catui-adm-field="who"></b><span data-catui-adm-field="text"></span> <span class="Catui_help" data-catui-adm-field="when"></span></div><span class="Catui_pill" data-catui-adm-class="Catui_pill-:tone"><i class="Catui_dot"></i><span data-catui-adm-field="state"></span></span></div></template></div></div>
  </article>
</div>
<script>
// 진행률·남은 기간·예산·오늘 표시 위치는 project-promo.json 원자료에서 계산
catui.admin.derive['project-promo'] = function (j) {
  var day = 864e5, d = function (x) { var p = x.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); };
  var total = j.members.reduce(function (a, m) { return a + m.tasks; }, 0), span = (d(j.end) - d(j.start)) / day;
  var PRI = { high: '높음', mid: '보통', low: '낮음' }, md = function (x) { var p = x.split('-'); return +p[1] + '월 ' + +p[2] + '일'; };
  j.pct = Math.round(j.tasksDone / total * 100); j.tasksLabel = j.tasksDone + ' / ' + total;
  j.leftLabel = Math.round((d(j.end) - d(j.today)) / day) + '일';
  j.budgetPct = Math.round(j.budget.spent / j.budget.total * 100);
  j.budgetLabel = catui.util.number(j.budget.spent / 1e4) + '만 / ' + catui.util.number(j.budget.total / 1e4) + '만원';
  j.summary = md(j.start) + ' ~ ' + md(j.end) + ' · 담당 ' + j.members[0].name + ' 외 ' + (j.members.length - 1) + '명';
  var todayPos = Math.round((d(j.today) - d(j.start)) / day / span * 100);
  j.phases.forEach(function (p, i) { p.noMile = p.milestone == null; p.noToday = i !== 0; p.todayPos = todayPos; });
  j.members.forEach(function (m) { m.meta = m.role + ' · ' + m.tasks + '건'; });
  j.week.forEach(function (t) { t.priorityNote = ' (' + (PRI[t.priority] || t.priority) + ')'; });
  return j;
};
catui.admin.on('data', function (e) { if (e.name === 'project-promo') document.getElementById('pd-pct-bar').style.width = e.data.pct + '%'; });
</script>
