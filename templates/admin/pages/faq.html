<!-- title: 도움말 | crumb: 관리 / 도움말 -->
<div class="Catui_adm-head"><div><h1 class="Catui_h1">도움말</h1><p>자주 묻는 질문 · 찾는 답이 없으면 문의를 남겨 주세요</p></div></div>
<div class="Catui_grid">
  <section class="Catui_span-8 Catui_vstack Catui_gap-4" aria-label="자주 묻는 질문">
    <div class="Catui_search">{{icon:search}}<label class="Catui_clip" for="fq-q">질문 찾기</label><input class="Catui_input" id="fq-q" type="search" placeholder="예: 환불, 송장, 권한"></div>
    <p class="Catui_help" id="fq-n" aria-live="polite"></p>
    <div class="Catui_vstack Catui_gap-3" id="fq-list" data-catui-adm-src="faq" data-catui-adm-rows=""><template><details class="Catui_faq"><summary data-catui-adm-field="q"></summary><p data-catui-adm-field="a"></p></details></template></div>
  </section>
  <aside class="Catui_card Catui_span-4" aria-labelledby="fq-c-t">
    <header class="Catui_card-h" id="fq-c-t">문의하기</header>
    <form class="Catui_card-b Catui_vstack Catui_gap-3" id="fq-form" data-catui-form data-catui-filter="fq-form" novalidate>
      <div class="Catui_field"><label class="Catui_label" for="fq-type">분류</label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="fq-type" name="type"><option>주문·배송</option><option>결제·정산</option><option>계정·권한</option><option>기타</option></select>{{icon:chevron-down}}</div></div>
      <div class="Catui_field"><label class="Catui_label" for="fq-msg">내용</label><textarea class="Catui_input" id="fq-msg" name="msg" rows="5" data-catui-verify="required|minlen:10" data-catui-counter="500"></textarea></div>
      <button class="Catui_btn Catui_btn-md Catui_btn-primary" type="submit" data-catui-submit>보내기</button>
      <p class="Catui_help">평일 9~18시 · 보통 2시간 안에 답장</p>
    </form>
  </aside>
</div>
<script>
catui.use(['form', 'layer'], function (form, layer) {
  var q = document.getElementById('fq-q');
  var run = function () {
    var t = q.value.trim(), n = 0, items = [].slice.call(document.querySelectorAll('#fq-list details'));   // 목록은 faq.json에서 그려지므로 매번 읽는다
    items.forEach(function (d) { var hit = !t || d.textContent.indexOf(t) > -1; d.hidden = !hit; if (hit) n++; d.open = !!t && hit; });
    document.getElementById('fq-n').textContent = t ? n + '개 질문이 맞습니다' : '';
  };
  q.addEventListener('input', run);
  form.on('submit(fq-form)', function (d) { layer.msg('문의를 받았습니다. 메일로 답장 드립니다.', { icon: 'success' }); d.form.reset(); return false; });
});
</script>
