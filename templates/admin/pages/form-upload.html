<!-- title: 업로드 | crumb: 폼 / 업로드 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">업로드</h1><p>끌어 놓기 · 형식·용량 검사 · 진행률 · 사진 미리보기</p></div>
</div>

<div class="Catui_grid">
  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">문서 올리기 <span class="Catui_adm-card-meta">PDF·문서, 10MB · 5개까지</span></header>
    <div class="Catui_card-b Catui_vstack Catui_gap-3">
      <label class="Catui_upz" id="fu-zone">{{icon:upload}}<span class="Catui_upz-title">파일을 끌어 놓거나 눌러서 고르세요</span><span class="Catui_upz-hint">PDF, DOCX, XLSX · 10MB 이하</span><input class="Catui_clip" type="file" id="fu-file" multiple accept=".pdf,.docx,.xlsx"></label>
      <div class="Catui_files" id="fu-list" aria-live="polite"></div>
    </div>
  </article>
  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">상품 사진 <span class="Catui_adm-card-meta">이미지 · 8장까지</span></header>
    <div class="Catui_card-b Catui_vstack Catui_gap-3">
      <label class="Catui_upz">{{icon:image}}<span class="Catui_upz-title">사진을 고르세요</span><span class="Catui_upz-hint">JPG·PNG·WEBP · 첫 장이 대표 사진</span><input class="Catui_clip" type="file" id="fu-img" multiple accept="image/*"></label>
      <div class="Catui_adm-thumbs" id="fu-thumbs" aria-label="고른 사진"></div>
      <p class="Catui_help" id="fu-img-count" aria-live="polite">고른 사진이 없습니다.</p>
    </div>
  </article>

  <article class="Catui_card Catui_span-12">
    <header class="Catui_card-h">올린 파일</header>
    <div class="Catui_card-b">
      <div class="Catui_files">
        <div class="Catui_file"><span class="Catui_file-ico Catui_file-ico-5">{{icon:file-text}}</span><span class="Catui_file-main"><span class="Catui_file-name">11월_정산서.pdf</span><span class="Catui_file-meta">1.4MB · 올리는 중 62% <span class="Catui_prog Catui_prog-sm" role="progressbar" aria-label="11월_정산서.pdf 올리는 중" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i class="Catui_pc2" style="width:62%"></i></span></span></span></div>
        <div class="Catui_file"><span class="Catui_file-ico Catui_file-ico-2">{{icon:table}}</span><span class="Catui_file-main"><span class="Catui_file-name">재고현황_1102.xlsx</span><span class="Catui_file-meta">86KB · 완료</span></span></div>
        <div class="Catui_file"><span class="Catui_file-ico Catui_file-ico-3">{{icon:file}}</span><span class="Catui_file-main"><span class="Catui_file-name">계약서_초안.docx</span><span class="Catui_file-meta">214KB · 완료</span></span></div>
      </div>
    </div>
  </article>
</div>
<script>
catui.use(['upload', 'util', 'layer'], function (upload, util, layer) {
  // url을 비우면 서버로 보내지 않고 고른 파일만 관리 (실서비스는 url: '/api/files')
  upload.render({ elem: '#fu-zone', accept: '.pdf,.docx,.xlsx', size: 10240, number: 5, list: '#fu-list',
    error: function (msg) { layer.msg(msg, { icon: 'warn' }); } });
  var input = document.getElementById('fu-img'), box = document.getElementById('fu-thumbs'), count = document.getElementById('fu-img-count');
  var files = [];
  var draw = function () {
    box.replaceChildren();
    files.forEach(function (f, i) {
      var fig = document.createElement('figure'); fig.className = 'Catui_adm-thumb';
      var img = document.createElement('img'); img.src = f.url; img.alt = (i === 0 ? '대표 사진: ' : '') + f.file.name;
      var del = document.createElement('button'); del.type = 'button'; del.className = 'Catui_btn Catui_btn-sm Catui_btn-secondary Catui_btn-icon'; del.setAttribute('aria-label', f.file.name + ' 빼기');
      catui.mount(del, catui.icon('x', 16));
      del.addEventListener('click', function () { URL.revokeObjectURL(f.url); files.splice(i, 1); draw(); });
      fig.append(img, del); box.appendChild(fig);
    });
    count.textContent = files.length ? files.length + '장 · ' + util.fileSize(files.reduce(function (a, f) { return a + f.file.size; }, 0)) : '고른 사진이 없습니다.';
  };
  input.addEventListener('change', function () {
    [].slice.call(input.files).forEach(function (file) {
      if (!file.type.startsWith('image/')) { layer.msg(file.name + ': 이미지가 아닙니다', { icon: 'warn' }); return; }
      if (files.length >= 8) { layer.msg('8장까지 올릴 수 있습니다', { icon: 'warn' }); return; }
      files.push({ file: file, url: URL.createObjectURL(file) });
    });
    input.value = ''; draw();
  });
});
</script>
