<!-- title: 칸반 | crumb: 앱 / 칸반 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">11월 프로모션 보드</h1><p>카드를 끌어 옮기거나, 카드에 포커스를 두고 ←→로 열을 바꾸고 ↑↓로 순서를 바꿉니다</p></div>
  <div class="Catui_actions"><div class="Catui_av-stack" role="img" aria-label="참여자 4명"><span class="Catui_av Catui_av-sm">김</span><span class="Catui_av Catui_av-sm">이</span><span class="Catui_av Catui_av-sm">박</span><span class="Catui_av Catui_av-sm">+1</span></div><button class="Catui_btn Catui_btn-md Catui_btn-primary" type="button" id="kb-add">{{icon:plus}}카드 추가</button></div>
</div>
<div class="Catui_kanban" id="kb-board" aria-busy="true"></div>
<script>
catui.use(['layer'], function (layer) {
  // 모의 데이터: data/kanban.json — 열과 카드를 그린 뒤 끌어 옮기기·키보드 이동을 붙인다
  var board;
  catui.admin.data('kanban').then(function (d) {
  var el = document.getElementById('kb-board');
  catui.mount(el, catui.html`${d.columns.map(function (c, i) { return catui.html`<section class="Catui_kanban-col" aria-labelledby="kb-c${i + 1}"><h2 class="Catui_kanban-h" id="kb-c${i + 1}">${c.title}<span class="Catui_count">${c.cards.length}</span></h2>${c.cards.map(function (k) { return catui.html`<article class="Catui_kanban-card"><div class="Catui_kanban-tags"><span class="Catui_pill Catui_pill-${k.tone}">${k.tag}</span></div><span class="Catui_kanban-title">${k.title}</span><div class="Catui_kanban-meta">${catui.icon('check', 12)}${k.done}/${k.total} · ${k.due}<span class="Catui_av Catui_av-sm">${k.who}</span></div></article>`; })}<div class="Catui_empty" data-catui-adm-empty${c.cards.length ? ' hidden' : ''}><p class="Catui_empty-text">카드가 없습니다</p></div></section>`; })}`);
  el.removeAttribute('aria-busy');
  board = catui.admin.kanban(el);
  });
  catui.admin.on('kanban', function (d) { if (d.to !== d.from && d.to.querySelector('#kb-c4')) layer.msg('완료로 옮겼습니다', { icon: 'success', time: 1200 }); });
  document.getElementById('kb-add').addEventListener('click', function () {
    layer.form({ title: '카드 추가', area: 'sm', fields: [{ name: 'title', label: '제목', required: true, maxlength: 40 }, { name: 'tag', label: '분류', type: 'select', options: ['디자인', '개발', '마케팅', '운영'] }, { name: 'who', label: '담당', type: 'select', options: ['김', '이', '박', '최', '정'] }] })
      .then(function (v) {
        if (!v) return;
        var card = document.createElement('article'); card.className = 'Catui_kanban-card';
        catui.mount(card, catui.html`<div class="Catui_kanban-tags"><span class="Catui_pill Catui_pill-neutral">${v.tag}</span></div><span class="Catui_kanban-title">${v.title}</span><div class="Catui_kanban-meta">${catui.icon('check', 12)}0/1<span class="Catui_av Catui_av-sm">${v.who}</span></div>`);
        var col = document.querySelector('#kb-c1')?.parentElement; if (!col || !board) return;   // 보드 데이터가 오기 전이면 무시
        board.add(col, card); col.insertBefore(card, col.querySelector('[data-catui-adm-empty]')); card.focus();
      });
  });
});
</script>
