<!-- title: 매출 대시보드 | crumb: 대시보드 / 매출 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">매출</h1><p>2026년 11월 · 월 목표 5,500만원</p></div>
  <div class="Catui_actions"><button class="Catui_btn Catui_btn-md Catui_btn-secondary" type="button">{{icon:download}}CSV</button></div>
</div>

<div class="Catui_grid" data-catui-adm-src="dashboard-sales">
  <article class="Catui_card Catui_span-4">
    <header class="Catui_card-h">이번 달 매출</header>
    <div class="Catui_card-b Catui_vstack Catui_gap-3">
      <div class="Catui_adm-kpi"><b data-catui-adm-count data-catui-adm-src="dashboard-sales" data-catui-adm-text="kpi.revenue" data-catui-adm-format="man">4,820만원</b><span class="Catui_pill Catui_pill-success Catui_delta-up">▲ 12.6%<span class="Catui_clip"> 증가</span></span></div>
      <div><div class="Catui_prog-label"><span>목표 달성</span><span class="Catui_num">87%</span></div><div class="Catui_meter" role="img" aria-label="목표 87퍼센트 달성"><i style="width:87%"></i></div></div>
      <p class="Catui_help">남은 680만원 · 하루 평균 24만원 필요</p>
    </div>
  </article>
  <article class="Catui_card Catui_span-4">
    <header class="Catui_card-h">평균 주문 금액</header>
    <div class="Catui_card-b Catui_vstack Catui_gap-3">
      <div class="Catui_adm-kpi"><b data-catui-adm-count data-catui-adm-src="dashboard-sales" data-catui-adm-text="kpi.avgOrder" data-catui-adm-format="won">37,540원</b><span class="Catui_pill Catui_pill-success Catui_delta-up">▲ 2.2%<span class="Catui_clip"> 증가</span></span></div>
      <div class="Catui_adm-chart Catui_sparkline" data-catui-adm-chart="spark" data-catui-adm-label="평균 주문 금액 추이" data-catui-adm-src="dashboard-sales" data-catui-adm-key="charts.sales_1"></div>
    </div>
  </article>
  <article class="Catui_card Catui_span-4">
    <header class="Catui_card-h">환불</header>
    <div class="Catui_card-b Catui_vstack Catui_gap-3">
      <div class="Catui_adm-kpi"><b data-catui-adm-count data-catui-adm-src="dashboard-sales" data-catui-adm-text="kpi.refunds" data-catui-adm-format="man">186만원</b><span class="Catui_pill Catui_pill-danger Catui_delta-down">▲ 0.6%p<span class="Catui_clip"> 증가(나쁨)</span></span></div>
      <p class="Catui_help">23건 · 주원인 "단순 변심" 48%</p>
    </div>
  </article>

  <article class="Catui_card Catui_span-8">
    <header class="Catui_card-h">월별 매출 <span class="Catui_adm-card-meta">단위 만원</span></header>
    <div class="Catui_card-b">
      <div class="Catui_adm-chart Catui_adm-chart-lg" data-catui-adm-chart="bar" data-catui-adm-key="charts.c1" data-catui-adm-label="2026년 월별 매출과 비용" ></div>
      <ul class="Catui_legend Catui_legend-row Catui_adm-legend" data-catui-adm-legend aria-label="범례"></ul>
    </div>
  </article>
  <article class="Catui_card Catui_span-4">
    <header class="Catui_card-h">분류별 매출</header>
    <div class="Catui_card-b">
      <div class="Catui_adm-chart" data-catui-adm-chart="donut" data-catui-adm-key="charts.c2" data-catui-adm-label="분류별 매출 비율" ></div>
      <ul class="Catui_legend Catui_adm-legend" data-catui-adm-legend aria-label="범례"></ul>
    </div>
  </article>

  <article class="Catui_card Catui_span-12">
    <header class="Catui_card-h">많이 팔린 상품</header>
    <div class="Catui_card-b Catui_adm-flush">
      <table class="Catui_tbl">
        <caption class="Catui_clip">많이 팔린 상품 5개</caption>
        <thead><tr><th scope="col">순위</th><th scope="col">상품</th><th scope="col">분류</th><th scope="col" class="Catui_num">판매</th><th scope="col" class="Catui_num">매출</th><th scope="col">재고</th></tr></thead>
        <tbody data-catui-adm-src="dashboard-sales" data-catui-adm-rows="topProducts"><template><tr><td data-catui-adm-field="rank"></td><td data-catui-adm-field="name"></td><td data-catui-adm-field="category"></td><td class="Catui_num" data-catui-adm-field="sold" data-catui-adm-format="number"></td><td class="Catui_num" data-catui-adm-field="revenue" data-catui-adm-format="man"></td><td><span class="Catui_pill" data-catui-adm-class="Catui_pill-:stockTone"><i class="Catui_dot"></i><span data-catui-adm-field="stock"></span></span></td></tr></template></tbody>
      </table>
    </div>
  </article>
</div>
