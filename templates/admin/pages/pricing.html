<!-- title: 요금표 | crumb: 커머스 / 요금표 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">요금제</h1><p>언제든 바꾸거나 해지할 수 있습니다 · 부가세 별도</p></div>
  <div class="Catui_actions">
    <div class="Catui_segment" role="radiogroup" aria-label="결제 주기">
      <input class="Catui_clip" type="radio" name="pr-cycle" id="pr-m" value="m" checked><label for="pr-m">월간</label>
      <input class="Catui_clip" type="radio" name="pr-cycle" id="pr-y" value="y"><label for="pr-y">연간 (20% 할인)</label>
    </div>
  </div>
</div>

<div class="Catui_adm-plans" data-catui-adm-src="pricing" data-catui-adm-rows="plans"><template><article class="Catui_card Catui_price Catui_adm-plan" data-catui-adm-class="Catui_price-:featuredClass"><div class="Catui_card-b">
    <span class="Catui_pill Catui_pill-solid-success Catui_adm-plan-badge" data-catui-adm-field="badge" data-catui-adm-bool="hidden:noBadge"></span>
    <h2 class="Catui_h3" data-catui-adm-field="id"></h2><p class="Catui_help" data-catui-adm-field="desc"></p>
    <div class="Catui_adm-price Catui_adm-price-lg"><b data-catui-adm-field="priceM" data-catui-adm-attr="data-m:{priceM};data-y:{priceY}"></b><span class="Catui_help">/ 월</span></div>
    <ul data-catui-adm-rows="features"><template><li data-catui-adm-attr="aria-disabled:{off}"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use data-catui-adm-attr="href:{{dist}}/icons.svg?v=2#Catui_ic-{icon}"></use></svg><span><span data-catui-adm-field="text"></span><span class="Catui_clip" data-catui-adm-field="note"></span></span></li></template></ul>
    <button class="Catui_btn Catui_btn-md" type="button" data-catui-adm-class="Catui_btn-:btn" data-catui-adm-attr="data-plan:{id}" data-catui-adm-field="cta"></button>
  </div></article></template></div>

<div class="Catui_vstack Catui_gap-3">
  <details class="Catui_faq"><summary>요금제를 바꾸면 언제 적용되나요?</summary><p>바로 적용되고, 남은 기간은 일할 계산해 다음 청구에서 정산합니다.</p></details>
  <details class="Catui_faq"><summary>연간 결제를 중간에 해지할 수 있나요?</summary><p>가능합니다. 쓰지 않은 달만큼 환불해 드립니다.</p></details>
</div>
<script>
// 요금제 표시값은 pricing.json 원자료에서 계산 (연간 = 월 요금 × (1 − 할인율), 천 원 단위 내림)
catui.admin.derive.pricing = function (j) {
  var won = function (n) { return catui.util.number(n) + '원'; };
  j.plans.forEach(function (p) {
    p.priceM = won(p.monthly); p.priceY = won(Math.floor(p.monthly * (1 - j.yearlyDiscount / 100) / 1000) * 1000);
    p.featuredClass = p.featured ? 'featured' : ''; p.noBadge = !p.badge; p.btn = p.featured ? 'primary' : 'secondary';
    p.cta = p.current ? '현재 요금제' : p.id === '기업' ? '상담 신청' : catui.admin.josa(p.id, '으로') + ' 바꾸기';
    p.features.forEach(function (f) { f.icon = f.on ? 'check' : 'x'; f.off = String(!f.on); f.note = f.on ? '' : ' (포함 안 됨)'; });
  });
  return j;
};
</script>
<script>
catui.use(['layer'], function (layer) {
  document.querySelectorAll('[name=pr-cycle]').forEach(function (r) { r.addEventListener('change', function () {
    document.querySelectorAll('[data-m]').forEach(function (b) { b.textContent = r.value === 'y' ? b.dataset.y : b.dataset.m; });
  }); });
  document.querySelector('.Catui_adm-plans').addEventListener('click', function (e) {
    var b = e.target.closest('[data-plan]'); if (!b || b.textContent === '현재 요금제') return;
    layer.confirm(b.dataset.plan + ' 요금제로 바꿀까요? 바로 적용되며, 남은 기간은 일할 계산해 다음 청구에서 정산합니다.', { okText: '바꾸기' }, function (i) { layer.close(i); layer.msg(b.dataset.plan + ' 요금제로 바꿨습니다', { icon: 'success' }); });
  });
});
</script>
