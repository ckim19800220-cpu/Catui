<!-- title: 회원가입 | layout: blank -->
<div class="Catui_adm-auth">
  <aside class="Catui_adm-auth-brand" aria-label="소개">
    <p class="Catui_line"><span class="Catui_logo">C</span><b>CatuiAdmin</b></p>
    <div><h2>관리자 가입 신청</h2><p>최고 관리자가 승인하면 메일로 알려 드립니다.</p></div>
    <p class="Catui_help">© 2026 CatuiAdmin</p>
  </aside>
  <main class="Catui_adm-auth-main">
    <form class="Catui_adm-auth-card" id="rg-form" data-catui-form data-catui-filter="rg-form" novalidate>
      <div><h1 class="Catui_h1">가입 신청</h1><p class="Catui_help">이미 계정이 있나요? <a class="Catui_link" href="login.html">로그인</a></p></div>
      <div class="Catui_field"><label class="Catui_label" for="rg-name">이름</label><input class="Catui_input" id="rg-name" name="name" autocomplete="name" data-catui-verify="required"></div>
      <div class="Catui_field"><label class="Catui_label" for="rg-mail">회사 이메일</label><input class="Catui_input" id="rg-mail" name="email" type="email" autocomplete="email" data-catui-verify="required|email"></div>
      <div class="Catui_field"><label class="Catui_label" for="rg-pw">비밀번호</label>
        <div class="Catui_adm-pw"><input class="Catui_input" id="rg-pw" name="pw" type="password" autocomplete="new-password" data-catui-verify="required|password" aria-describedby="rg-pw-h rg-caps"><button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-catui-adm-pwtoggle aria-label="비밀번호 보기">{{icon:eye:16}}</button></div>
        <div class="Catui_adm-strength" data-catui-adm-strength="#rg-pw"><i></i><i></i><i></i><i></i><span></span></div>
        <p class="Catui_help" id="rg-pw-h">8자 이상, 영문·숫자 포함 · 12자 이상과 특수문자를 쓰면 더 안전합니다</p>
        <p class="Catui_adm-caps" id="rg-caps" data-catui-adm-caps="#rg-pw" hidden>{{icon:alert-triangle:12}}Caps Lock이 켜져 있습니다</p></div>
      <div class="Catui_field"><label class="Catui_label" for="rg-pw2">비밀번호 확인</label><input class="Catui_input" id="rg-pw2" name="pw2" type="password" autocomplete="new-password" data-catui-verify="required|same:pw"></div>
      <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="agree" data-catui-verify="required" data-catui-reqtext="약관에 동의해 주세요."><span class="Catui_cbx">{{icon:check:12}}</span>이용약관·개인정보 처리방침에 동의합니다</label>
      <button class="Catui_btn Catui_btn-lg Catui_btn-primary" type="submit" data-catui-submit>신청하기</button>
    </form>
  </main>
</div>
<script>
catui.use(['form', 'layer'], function (form, layer) {
  form.on('submit(rg-form)', function (d) { layer.alert(d.field.email + '로 승인 결과를 보내 드립니다.', { title: '신청 완료' }, function () { location.href = 'login.html'; }); return false; });
});
</script>
