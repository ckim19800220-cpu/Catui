<!-- title: 기본 폼 | crumb: 폼 / 기본 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">상품 등록</h1><p>구역별로 나눈 기본 입력 폼 · 저장하지 않고 나가면 확인합니다</p></div>
</div>

<form class="Catui_vstack Catui_gap-6" id="fm-product" data-catui-form data-catui-filter="fm-product" data-catui-adm-form novalidate>
  <section class="Catui_adm-section" aria-labelledby="fm-s1">
    <div class="Catui_adm-section-desc"><h2 id="fm-s1">기본 정보</h2><p>고객에게 보이는 이름과 설명입니다.</p></div>
    <div class="Catui_card"><div class="Catui_card-b Catui_adm-cols">
      <div class="Catui_field Catui_adm-wide"><label class="Catui_label" for="fm-name">상품명 <span class="Catui_req">필수</span></label><input class="Catui_input" id="fm-name" name="name" maxlength="60" data-catui-verify="required" data-catui-reqtext="상품명을 입력해 주세요." value="기계식 키보드 K8"></div>
      <div class="Catui_field"><label class="Catui_label" for="fm-sku">상품 코드</label><input class="Catui_input" id="fm-sku" name="sku" value="KB-K8-BLK" aria-describedby="fm-sku-h" pattern="[A-Za-z0-9-]*" maxlength="30"><p class="Catui_help" id="fm-sku-h">영문·숫자·하이픈(-) · 비우면 자동 생성</p></div>
      <div class="Catui_field"><label class="Catui_label" for="fm-cat">분류 <span class="Catui_req">필수</span></label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="fm-cat" name="category" data-catui-verify="required"><option value="">선택</option><option selected>키보드</option><option>마우스</option><option>모니터</option><option>액세서리</option></select>{{icon:chevron-down}}</div></div>
      <div class="Catui_field Catui_adm-wide"><label class="Catui_label" for="fm-desc">설명</label><textarea class="Catui_input" id="fm-desc" name="desc" rows="4" data-catui-counter="300">저소음 적축, 블루투스·유선 겸용, 한글 각인.</textarea></div>
    </div></div>
  </section>

  <section class="Catui_adm-section" aria-labelledby="fm-s2">
    <div class="Catui_adm-section-desc"><h2 id="fm-s2">가격 · 재고</h2><p>할인가를 비우면 판매가로 팝니다.</p></div>
    <div class="Catui_card"><div class="Catui_card-b Catui_adm-cols">
      <div class="Catui_field"><label class="Catui_label" for="fm-price">판매가 <span class="Catui_req">필수</span></label><div class="Catui_igroup"><input class="Catui_input" id="fm-price" name="price" inputmode="numeric" value="189000" data-catui-verify="required|int|min:0"><span class="Catui_igroup-addon">원</span></div></div>
      <div class="Catui_field"><label class="Catui_label" for="fm-sale">할인가</label><div class="Catui_igroup"><input class="Catui_input" id="fm-sale" name="sale" inputmode="numeric" data-catui-verify="int|min:0"><span class="Catui_igroup-addon">원</span></div></div>
      <div class="Catui_field"><span class="Catui_label" id="fm-stock-l">재고</span><div class="Catui_stepper" data-catui-stepper data-catui-min="0" data-catui-max="9999" data-catui-value="42" data-catui-name="stock" data-catui-unit="개" aria-labelledby="fm-stock-l"></div></div>
      <div class="Catui_field"><label class="Catui_label" for="fm-tax">과세</label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="fm-tax" name="tax"><option>과세</option><option>면세</option></select>{{icon:chevron-down}}</div></div>
    </div></div>
  </section>

  <section class="Catui_adm-section" aria-labelledby="fm-s3">
    <div class="Catui_adm-section-desc"><h2 id="fm-s3">판매 설정</h2><p>노출 상태와 배송 방식입니다.</p></div>
    <div class="Catui_card"><div class="Catui_card-b Catui_vstack Catui_gap-4">
      <fieldset><legend class="Catui_label">상태</legend>
        <div class="Catui_choices">
          <label class="Catui_choice"><input class="Catui_clip" type="radio" name="status" value="sale" checked><span class="Catui_radio"></span>판매 중</label>
          <label class="Catui_choice"><input class="Catui_clip" type="radio" name="status" value="hidden"><span class="Catui_radio"></span>숨김</label>
          <label class="Catui_choice"><input class="Catui_clip" type="radio" name="status" value="soldout"><span class="Catui_radio"></span>품절</label>
        </div></fieldset>
      <fieldset><legend class="Catui_label">배송</legend>
        <div class="Catui_choices">
          <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="ship" value="parcel" checked><span class="Catui_cbx">{{icon:check:12}}</span>택배</label>
          <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="ship" value="quick"><span class="Catui_cbx">{{icon:check:12}}</span>퀵 배송</label>
          <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="ship" value="pickup"><span class="Catui_cbx">{{icon:check:12}}</span>매장 수령</label>
        </div></fieldset>
      <span class="Catui_choice"><input class="Catui_clip" id="fm-feat" name="featured" type="checkbox" role="switch" checked><label class="Catui_tgl" for="fm-feat"></label><label for="fm-feat">메인 화면 추천 상품으로 노출</label></span>
    </div></div>
  </section>

  <div class="Catui_adm-savebar" data-catui-adm-savebar>
    <span class="Catui_adm-savenote" data-catui-adm-savenote aria-live="polite">모든 변경 사항이 저장되었습니다</span>
    <div class="Catui_actions">
      <button class="Catui_btn Catui_btn-md Catui_btn-ghost" type="reset">되돌리기</button>
      <button class="Catui_btn Catui_btn-md Catui_btn-primary" type="submit" data-catui-submit>저장</button>
    </div>
  </div>
</form>
<script>
catui.use(['form', 'layer'], function (form, layer) {
  // 예제: 서버 대신 0.5초 뒤 저장 성공 처리 (실서비스는 data-catui-ajax="/api/products"로 보내면 자동)
  form.on('submit(fm-product)', function (d) {
    var btn = d.form.querySelector('[type=submit]'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    setTimeout(function () { btn.disabled = false; btn.removeAttribute('aria-busy'); catui.admin.form.saved(d.form); layer.msg('저장했습니다', { icon: 'success' }); }, 500);
    return false;
  });
});
</script>
