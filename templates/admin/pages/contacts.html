<!-- title: 연락처 | crumb: 관리 / 연락처 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">연락처</h1><p>거래처·협력사 담당자</p></div>
  <div class="Catui_actions"><div class="Catui_search">{{icon:search}}<label class="Catui_clip" for="cc-q">연락처 찾기</label><input class="Catui_input" id="cc-q" type="search" placeholder="이름·회사"></div><button class="Catui_btn Catui_btn-md Catui_btn-primary" type="button" id="cc-add">{{icon:plus}}추가</button></div>
</div>
<div class="Catui_adm-projects" id="cc-grid"></div>
<script>
catui.use(['layer', 'util'], function (layer, util) {
  // 모의 데이터: data/contacts.json
  catui.admin.data('contacts').then(function (people) {
  people = people.slice();
  var grid = document.getElementById('cc-grid');
  var draw = function () {
    var q = document.getElementById('cc-q').value.trim();
    var shown = people.filter(function (p) { return !q || (p.name + p.co + p.role).indexOf(q) > -1; });
    catui.mount(grid, shown.length ? catui.html`${shown.map(function (p) { return catui.html`<article class="Catui_card Catui_adm-project"><div class="Catui_card-b">
      <div class="Catui_adm-project-h"><span class="Catui_av Catui_av-lg" aria-hidden="true">${p.name.slice(0, 1)}</span><div><b>${p.name}</b><p class="Catui_help">${p.role} · ${p.co}</p></div></div>
      <ul class="Catui_list Catui_list-flush"><li class="Catui_list-item">${catui.icon('mail', 16)}<a href="mailto:${p.mail}">${p.mail}</a></li><li class="Catui_list-item">${catui.icon('phone', 16)}<a href="tel:${p.tel.replace(/-/g, '')}">${p.tel}</a></li></ul>
      <div class="Catui_actions"><a class="Catui_btn Catui_btn-sm Catui_btn-secondary" href="chat.html">${catui.icon('message-square', 16)}채팅</a><button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" data-copy="${p.mail}">${catui.icon('copy', 16)}메일 복사</button></div>
    </div></article>`; })}` : catui.html`<div class="Catui_empty">${catui.icon('search', 16)}<p class="Catui_empty-title">맞는 연락처가 없습니다</p></div>`);
  };
  grid.addEventListener('click', function (e) { var b = e.target.closest('[data-copy]'); if (b) util.copy(b.dataset.copy).then(function (ok) { layer.msg(ok ? '복사했습니다' : '복사하지 못했습니다', { icon: ok ? 'success' : 'warn', time: 1200 }); }); });
  document.getElementById('cc-q').addEventListener('input', draw);
  document.getElementById('cc-add').addEventListener('click', function () {
    layer.form({ title: '연락처 추가', area: 'sm', fields: [{ name: 'name', label: '이름', required: true }, { name: 'co', label: '회사', required: true }, { name: 'role', label: '역할' }, { name: 'mail', label: '이메일', type: 'email', required: true }, { name: 'tel', label: '전화', type: 'tel' }] })
      .then(function (v) { if (!v) return; people.unshift({ name: v.name, co: v.co, role: v.role || '', mail: v.mail, tel: v.tel || '', tone: 1 }); draw(); layer.msg('추가했습니다', { icon: 'success' }); });
  });
  draw();
  });
});
</script>
