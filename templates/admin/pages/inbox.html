<!-- title: 받은편지함 | crumb: 앱 / 받은편지함 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">받은편지함</h1></div>
  <div class="Catui_actions"><button class="Catui_btn Catui_btn-md Catui_btn-primary" type="button" id="ib-new">{{icon:pen-line}}새 메일</button></div>
</div>
<div class="Catui_adm-split" id="ib-split">
  <section class="Catui_adm-pane" aria-labelledby="ib-list-t">
    <div class="Catui_adm-pane-h">
      <h2 id="ib-list-t">메일</h2>
      <div class="Catui_segment" role="radiogroup" aria-label="메일 거르기" style="margin-left:auto">
        <input class="Catui_clip" type="radio" name="ib-f" id="ib-f1" value="all" checked><label for="ib-f1">전체</label>
        <input class="Catui_clip" type="radio" name="ib-f" id="ib-f2" value="unread"><label for="ib-f2">안 읽음</label>
        <input class="Catui_clip" type="radio" name="ib-f" id="ib-f3" value="star"><label for="ib-f3">별표</label>
      </div>
    </div>
    <div class="Catui_adm-pane-b" style="padding:0"><ul class="Catui_adm-rows" id="ib-list"></ul></div>
  </section>
  <section class="Catui_adm-pane" aria-labelledby="ib-subj">
    <div class="Catui_adm-pane-h">
      <button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon Catui_adm-back" type="button" data-catui-adm-back aria-label="메일 목록으로">{{icon:chevron-left}}</button>
      <div class="Catui_actions">
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" id="ib-reply">{{icon:corner-down-left}}답장</button>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" id="ib-star" aria-pressed="false" aria-label="별표">{{icon:star}}</button>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" id="ib-del" aria-label="삭제">{{icon:trash-2}}</button>
      </div>
    </div>
    <div class="Catui_adm-pane-b">
      <div class="Catui_adm-mail-h"><h2 id="ib-subj"></h2><p class="Catui_line"><span class="Catui_av Catui_av-sm" aria-hidden="true" id="ib-av"></span><b id="ib-from"></b><span class="Catui_help" id="ib-date"></span></p></div>
      <div class="Catui_adm-mail-body" id="ib-body"></div>
    </div>
  </section>
</div>
<script>
catui.use(['layer'], function (layer) {
  var mails = [
    { id: 1, from: '김하늘', subj: '11월 프로모션 배너 시안', body: '안녕하세요.\n요청하신 프로모션 배너 시안 3종을 첨부합니다. 금요일까지 의견 부탁드립니다.\n\n김하늘 드림', date: '오늘 09:40', unread: true, star: true },
    { id: 2, from: '물류팀', subj: '[공지] 11월 택배 마감 시간 변경', body: '11월 11일부터 택배 마감이 오후 3시에서 2시로 앞당겨집니다.', date: '오늘 08:15', unread: true, star: false },
    { id: 3, from: '이준', subj: '재고 보고서 (10월)', body: '10월 재고 보고서를 공유합니다. 품절 임박 상품 4개가 있습니다.', date: '어제', unread: false, star: false },
    { id: 4, from: '결제대행사', subj: '정산 예정 금액 안내', body: '11월 5일 정산 예정 금액은 41,280,000원입니다.', date: '10월 31일', unread: false, star: true },
    { id: 5, from: '박서연', subj: 'Re: 고객 불만 처리 결과', body: '처리 완료했습니다. 쿠폰 지급으로 마무리했습니다.', date: '10월 30일', unread: false, star: false },
  ];
  var split = catui.admin.split('#ib-split'), list = document.getElementById('ib-list'), cur = mails[0], filter = 'all';
  var draw = function () {
    var shown = mails.filter(function (m) { return filter === 'all' || (filter === 'unread' ? m.unread : m.star); });
    catui.mount(list, shown.length ? catui.html`${shown.map(function (m) { return catui.html`<li><button class="Catui_adm-row${m.unread ? ' Catui_adm-row-unread' : ''}" type="button" data-mail="${m.id}" aria-current="${m === cur}"><span class="Catui_av Catui_av-sm" aria-hidden="true">${m.from.slice(0, 1)}</span><span class="Catui_adm-row-title">${m.star ? '★ ' : ''}${m.subj}${m.unread ? catui.html`<span class="Catui_clip"> (읽지 않음)</span>` : ''}</span><span class="Catui_adm-row-time">${m.date}</span><span class="Catui_adm-row-sub">${m.from} · ${m.body.split('\n')[0]}</span></button></li>`; })}` : catui.html`<li class="Catui_adm-empty">메일이 없습니다.</li>`);
  };
  var open = function (m) {
    cur = m; m.unread = false;
    document.getElementById('ib-subj').textContent = m.subj; document.getElementById('ib-from').textContent = m.from;
    document.getElementById('ib-av').textContent = m.from.slice(0, 1); document.getElementById('ib-date').textContent = m.date;
    var body = document.getElementById('ib-body'); body.replaceChildren(); m.body.split('\n').forEach(function (line) { var p = document.createElement('p'); p.textContent = line || '\u00a0'; body.appendChild(p); });
    var s = document.getElementById('ib-star'); s.setAttribute('aria-pressed', String(m.star)); s.setAttribute('aria-label', m.star ? '별표 빼기' : '별표');
    draw();
  };
  list.addEventListener('click', function (e) { var b = e.target.closest('[data-mail]'); if (!b) return; open(mails.find(function (m) { return m.id === Number(b.dataset.mail); })); split.show('detail'); });
  document.querySelectorAll('[name=ib-f]').forEach(function (r) { r.addEventListener('change', function () { filter = r.value; draw(); }); });
  document.getElementById('ib-star').addEventListener('click', function () { cur.star = !cur.star; open(cur); });
  document.getElementById('ib-del').addEventListener('click', function () {
    var m = cur, i = mails.indexOf(m); mails.splice(i, 1); open(mails[Math.min(i, mails.length - 1)] || mails[0]); split.show('list');
    layer.msg('메일을 지웠습니다', { icon: 'info', action: { text: '되돌리기', onClick: function () { mails.splice(i, 0, m); open(m); } } });
  });
  var compose = function (to, subj) {
    layer.form({ title: '새 메일', area: 'md', okText: '보내기', fields: [{ name: 'to', label: '받는 사람', type: 'email', required: true, value: to || '' }, { name: 'subj', label: '제목', required: true, value: subj || '' }, { name: 'body', label: '내용', type: 'textarea', rows: 6 }] })
      .then(function (v) { if (v) layer.msg(v.to + '에게 보냈습니다', { icon: 'success' }); });
  };
  document.getElementById('ib-new').addEventListener('click', function () { compose(); });
  document.getElementById('ib-reply').addEventListener('click', function () { compose('', 'Re: ' + cur.subj); });
  open(cur);
});
</script>
