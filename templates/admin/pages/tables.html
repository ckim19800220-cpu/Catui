<!-- title: 정적 표 | crumb: 표 / 정적 표 -->
<div class="Catui_adm-head">
  <div><h1 class="Catui_h1">정적 표</h1><p>스크립트 없이 쓰는 표 변형 — 기본 · 촘촘 · 테두리 · 선택 · 행 메뉴 · 좁은 화면 카드형</p></div>
</div>

<div class="Catui_grid">
  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">기본 · 정렬 표시</header>
    <div class="Catui_card-b Catui_adm-flush"><div class="Catui_table-wrap">
      <table class="Catui_tbl">
        <caption class="Catui_clip">재고 현황 (상태 순)</caption>
        <thead><tr><th scope="col">상품</th><th scope="col" class="Catui_num">재고</th><th scope="col" class="Catui_sort" aria-sort="ascending">상태 {{icon:chevron-up:12}}</th></tr></thead>
        <tbody data-catui-adm-src="page-tables" data-catui-adm-rows="stock"><template><tr><td data-catui-adm-field="name"></td><td class="Catui_num" data-catui-adm-field="stock" data-catui-adm-format="number"></td><td><span class="Catui_pill" data-catui-adm-class="Catui_pill-:tone"><i class="Catui_dot"></i><span data-catui-adm-field="state"></span></span></td></tr></template></tbody>
      </table></div></div>
  </article>
  <article class="Catui_card Catui_span-6">
    <header class="Catui_card-h">촘촘 · 테두리</header>
    <div class="Catui_card-b Catui_adm-flush"><div class="Catui_table-wrap">
      <table class="Catui_tbl Catui_tbl-compact Catui_tbl-bordered">
        <caption class="Catui_clip">요일별 주문 수</caption>
        <thead><tr><th scope="col">요일</th><th scope="col" class="Catui_num">주문</th><th scope="col" class="Catui_num">매출</th><th scope="col" class="Catui_num">평균</th></tr></thead>
        <tbody data-catui-adm-src="page-tables" data-catui-adm-rows="weekdays"><template><tr><th scope="row" data-catui-adm-field="day"></th><td class="Catui_num" data-catui-adm-field="orders" data-catui-adm-format="number"></td><td class="Catui_num" data-catui-adm-field="revenue" data-catui-adm-format="man"></td><td class="Catui_num" data-catui-adm-field="avg" data-catui-adm-format="number"></td></tr></template></tbody>
        <tfoot data-catui-adm-src="page-tables"><tr><th scope="row">합계</th><td class="Catui_num" data-catui-adm-text="weekdayTotal.orders" data-catui-adm-format="number"></td><td class="Catui_num" data-catui-adm-text="weekdayTotal.revenue" data-catui-adm-format="man"></td><td class="Catui_num" data-catui-adm-text="weekdayTotal.avg" data-catui-adm-format="number"></td></tr></tfoot>
      </table></div></div>
  </article>

  <article class="Catui_card Catui_span-12">
    <header class="Catui_card-h">선택 · 행 메뉴 <span class="Catui_card-tools"><button class="Catui_btn Catui_btn-sm Catui_btn-secondary" type="button">{{icon:download}}내보내기</button></span></header>
    <div class="Catui_card-b Catui_adm-flush"><div class="Catui_table-wrap">
      <table class="Catui_tbl Catui_tbl-stack">
        <caption class="Catui_clip">관리자 목록 — 좁은 화면에서는 카드형으로 바뀝니다</caption>
        <thead><tr><th scope="col"><label class="Catui_choice"><input class="Catui_clip" type="checkbox" aria-label="모두 선택"><span class="Catui_cbx">{{icon:check:12}}</span></label></th><th scope="col">이름</th><th scope="col">이메일</th><th scope="col">권한</th><th scope="col">마지막 접속</th><th scope="col"><span class="Catui_clip">동작</span></th></tr></thead>
        <tbody data-catui-adm-src="users" data-catui-adm-rows=""><template><tr><td data-label="선택"><label class="Catui_choice"><input class="Catui_clip" type="checkbox" data-catui-adm-attr="aria-label:{name} 선택"><span class="Catui_cbx">{{icon:check:12}}</span></label></td><td data-label="이름"><span class="Catui_av Catui_av-xs" aria-hidden="true" data-catui-adm-field="name" data-catui-adm-format="initial"></span> <span data-catui-adm-field="name"></span></td><td data-label="이메일" data-catui-adm-field="email"></td><td data-label="권한"><span class="Catui_badge" data-catui-adm-class="Catui_badge-:roleTone" data-catui-adm-field="role"></span></td><td data-label="마지막 접속" data-catui-adm-field="last"></td><td data-label="동작"><details class="Catui_dd"><summary class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" data-catui-adm-attr="aria-label:{name} 메뉴">{{icon:more-horizontal}}</summary><div class="Catui_dd-menu Catui_dd-sm"><button class="Catui_dd-item" type="button">권한 변경</button><button class="Catui_dd-item" type="button">비밀번호 초기화</button><div class="Catui_dd-sep"></div><button class="Catui_dd-item Catui_dd-danger" type="button">계정 삭제</button></div></details></td></tr></template></tbody>
      </table></div></div>
  </article>
</div>
