<!-- title: 홈 | nav: home -->
<h1 class="Catui_clip">Catui 커뮤니티 홈</h1>

<section class="Catui_card" aria-labelledby="hm-topic-title">
  <header class="Catui_card-h"><h2 class="Catui_h3" id="hm-topic-title">관심 주제로 바로가기</h2><a class="Catui_cm-more" href="notice.html#rules">이용 규칙</a></header>
  <div class="Catui_card-b"><nav class="Catui_cm-cats Catui_cm-topics" id="hm-topics" aria-label="게시판 바로가기"></nav></div>
</section>

<section class="Catui_card" aria-labelledby="hm-best">
  <header class="Catui_card-h Catui_cm-feed-head"><h2 class="Catui_h3" id="hm-best">글 모아보기</h2>
    <nav class="Catui_cm-sort" id="hm-feed-controls" aria-label="글 모아보기 기준"><a href="?feed=1" aria-current="page" data-best="1">24시간</a><a href="?feed=7" data-best="7">주간</a><a href="?feed=new" data-best="new">최신</a><a href="?feed=fav" data-best="fav">즐겨찾기</a></nav>
    <a class="Catui_cm-more" href="hot.html">전체 인기글</a></header>
  <div class="Catui_card-b"><p class="Catui_help" id="hm-feed-state" role="status" aria-live="polite"></p><div class="Catui_cm-boards"><ol class="Catui_cm-mini Catui_cm-best" id="hm-best-a"></ol><ol class="Catui_cm-mini Catui_cm-best" id="hm-best-b"></ol></div></div>
</section>

<div class="Catui_cm-boards" id="hm-board-list" aria-label="게시판 최신글"></div>

<section class="Catui_card" aria-labelledby="hm-photo">
  <header class="Catui_card-h"><a id="hm-photo" href="board-gallery.html?b=photo">사진</a><a class="Catui_cm-more" href="board-gallery.html?b=photo">더보기</a></header>
  <div class="Catui_card-b"><ul class="Catui_cm-gallery" id="hm-photos"></ul></div>
</section>

<section class="Catui_card" aria-labelledby="hm-trend">
  <header class="Catui_card-h" id="hm-trend">많이 찾는 검색어</header>
  <div class="Catui_card-b"><nav class="Catui_cm-cats" id="hm-trends" aria-label="많이 찾는 검색어"></nav></div>
</section>
<script>
// 홈(포털형 위젯): 베스트 1~20(오늘·주간) · 게시판별 최신글 상자 · 사진 · 많이 찾는 검색어 — posts.json·boards.json·trends.json
catui.use(function () {
  var cm = catui.community;
  Promise.all([cm.load(), cm.data('trends')]).then(function (res) {
    var d = res[0];
    var controls = document.getElementById('hm-feed-controls'), modes = ['1', '7', 'new', 'fav'];
    catui.mount(document.getElementById('hm-topics'), catui.html`${d.boards.filter(function (b) { return b.write !== false; }).map(function (b) { return catui.html`<a href="${cm.boardHref(b)}" title="${b.desc}">${b.name}</a>`; })}`);
    var best = function () {
      var requested = cm.query().get('feed'), saved = cm.store.get('home-feed', '1');
      var mode = modes.indexOf(requested) > -1 ? requested : modes.indexOf(saved) > -1 ? saved : '1';
      var popular = mode === '1' || mode === '7', now = cm.now(), since = now - Number(mode) * 864e5;
      var list = d.posts.filter(function (p) { return p.board !== 'notice' && ['공지', '이벤트'].indexOf(p.cat) === -1 && new Date(p.time) <= now && (popular ? p.hot && new Date(p.time) > since : mode !== 'fav' || cm.fav.has(p.board)); });
      list.sort(function (a, b) { return popular ? b.score - a.score || new Date(b.time) - new Date(a.time) : new Date(b.time) - new Date(a.time); });
      list = list.slice(0, 20);
      var split = Math.ceil(list.length / 2), first = document.getElementById('hm-best-a'), second = document.getElementById('hm-best-b');
      catui.mount(first, list.length ? catui.html`${list.slice(0, split).map(function (p, i) { return cm.mini(p, { rank: popular ? i + 1 : 0, board: true }); })}` : cm.empty(mode === 'fav' ? '즐겨찾는 게시판의 글이 없습니다. 게시판에서 즐겨찾기를 추가해 보세요.' : popular ? '이 기간에 해당하는 인기글이 없습니다. 주간이나 최신 글을 확인해 보세요.' : '아직 등록된 글이 없습니다. 첫 이야기를 남겨 보세요.'));
      catui.mount(second, catui.html`${list.slice(split).map(function (p, i) { return cm.mini(p, { rank: popular ? split + i + 1 : 0, board: true }); })}`);
      second.setAttribute('start', String(split + 1));
      second.hidden = split === list.length;
      second.parentElement.style.gridTemplateColumns = second.hidden ? 'minmax(0,1fr)' : '';
      controls.querySelectorAll('a').forEach(function (a) { if (a.dataset.best === mode) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      document.getElementById('hm-feed-state').textContent = ({ '1': '최근 24시간 · 추천순', '7': '최근 7일 · 추천순', new: '전체 게시판 · 최신순', fav: '즐겨찾는 게시판 · 최신순' })[mode] + ' · ' + list.length + '개 표시';
      cm.store.set('home-feed', mode);
      if (modes.indexOf(requested) === -1) { var url = new URL(location.href); url.searchParams.set('feed', mode); history.replaceState(null, '', url); }
    };
    cm._on(controls, 'click', function (e) {
      var a = e.target.closest('[data-best]'); if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button) return; e.preventDefault();
      var url = new URL(location.href); url.searchParams.set('feed', a.dataset.best); history.pushState(null, '', url); best();
    });
    cm._on(window, 'popstate', best);
    best();
    var href = cm.boardHref;
    var boards = d.boards.filter(function (b) { return ['free', 'humor', 'info', 'qna', 'hotdeal', 'hobby', 'local'].indexOf(b.id) > -1; });
    catui.mount(document.getElementById('hm-board-list'), catui.html`${boards.map(function (b) {
      return catui.html`<section class="Catui_card" aria-labelledby="hb-${b.id}"><header class="Catui_card-h"><a id="hb-${b.id}" href="${href(b)}">${b.name}</a><span class="Catui_cm-meta">오늘 ${b.today}</span><a class="Catui_cm-more" href="${href(b)}">더보기</a></header><div class="Catui_card-b"><ul class="Catui_cm-mini">${d.posts.filter(function (p) { return p.board === b.id; }).slice(0, 6).map(function (p) { return cm.mini(p); })}</ul></div></section>`;
    })}`);
    catui.mount(document.getElementById('hm-photos'), catui.html`${d.posts.filter(function (p) { return p.board === 'photo'; }).slice(0, 4).map(function (p) { return catui.html`<li><a class="Catui_cm-shot" href="post.html?id=${p.id}"><figure><img src="${cm.thumb(p)}" alt="" loading="lazy" width="320" height="240"></figure><b>${p.title}</b></a></li>`; })}`);
    catui.mount(document.getElementById('hm-trends'), catui.html`${res[1].map(function (t, i) { return catui.html`<a href="search.html?q=${encodeURIComponent(t)}"><span class="Catui_num">${i + 1}</span> ${t}</a>`; })}`);
  });
});
</script>
