<!-- title: 홈 | nav: home -->
<h1 class="Catui_clip">Catui 커뮤니티 홈</h1>

<section aria-labelledby="hm-pick">
  <div class="Catui_cm-bar"><h2 class="Catui_cm-sec-t" id="hm-pick" data-tone="5">지금 뜨는 글</h2><a class="Catui_link" href="hot.html">인기글 전체</a></div>
  <div class="Catui_cm-hero" id="hm-hero" aria-busy="true"></div>
</section>

<section aria-labelledby="hm-hot">
  <h2 class="Catui_cm-sec-t" id="hm-hot">인기글 4~10위</h2>
  <ol class="Catui_cm-list" id="hm-hot-list" start="4"></ol>
</section>

<section aria-labelledby="hm-boards">
  <h2 class="Catui_cm-sec-t" id="hm-boards" data-tone="2">게시판 최신글</h2>
  <div class="Catui_cm-boards" id="hm-board-list"></div>
</section>

<section class="Catui_card" aria-labelledby="hm-trend">
  <header class="Catui_card-h" id="hm-trend">많이 찾는 검색어</header>
  <div class="Catui_card-b"><nav class="Catui_cm-cats" id="hm-trends" aria-label="많이 찾는 검색어"></nav></div>
</section>
<script>
// 홈: 지금 뜨는 글 1~3위(큰 카드) · 4~10위 · 게시판별 최신 5개 · 많이 찾는 검색어 — posts.json·boards.json·trends.json
catui.use(function () {
  var cm = catui.community;
  Promise.all([cm.load(), cm.data('trends')]).then(function (res) {
    var d = res[0], hot = d.posts.filter(function (p) { return p.hot; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 10);
    var hero = document.getElementById('hm-hero');
    catui.mount(hero, catui.html`${hot.slice(0, 3).map(function (p, i) {
      return catui.html`<a class="Catui_cm-pick" href="post.html?id=${p.id}" data-tone="${p.boardTone}">
        ${i === 0 && p.photo ? catui.html`<figure><img src="${cm.thumb({ id: p.id, tone: p.boardTone })}" alt="" width="640" height="280"></figure>` : ''}
        <span class="Catui_cm-pick-n" aria-hidden="true">${i + 1}</span>
        <span class="Catui_cm-board" data-tone="${p.boardTone}">${p.boardName}</span>
        <span class="Catui_cm-pick-t"><span class="Catui_clip">${i + 1}위 </span>${p.title}</span>
        <span class="Catui_cm-meta"><span class="Catui_cm-nick">${cm.avatar(p.author)}${p.author.nick}</span><span>추천 ${p.score}</span><span>댓글 ${p.comments}</span><time datetime="${p.time}">${cm.ago(p.time)}</time></span>
      </a>`;
    })}`);
    hero.removeAttribute('aria-busy');
    catui.mount(document.getElementById('hm-hot-list'), catui.html`${hot.slice(3).map(function (p, i) { return cm.row(p, { rank: i + 4 }); })}`);
    var boards = d.boards.filter(function (b) { return ['free', 'humor', 'info', 'qna', 'hobby', 'local'].indexOf(b.id) > -1; });
    var href = function (b) { return ({ info: 'board-card.html?b=info', qna: 'qna.html' })[b.id] || 'board.html?b=' + b.id; };
    catui.mount(document.getElementById('hm-board-list'), catui.html`${boards.map(function (b) {
      var rows = d.posts.filter(function (p) { return p.board === b.id; }).slice(0, 5);
      return catui.html`<section class="Catui_card" aria-labelledby="hb-${b.id}" data-tone="${b.tone}"><header class="Catui_card-h"><a class="Catui_cm-sec-t" id="hb-${b.id}" href="${href(b)}">${b.name}</a><span class="Catui_cm-meta">오늘 ${b.today} · 전체 ${b.count}</span></header><div class="Catui_card-b"><ul class="Catui_cm-list">${rows.map(function (p) { return cm.row(p, { board: false }); })}</ul></div></section>`;
    })}`);
    catui.mount(document.getElementById('hm-trends'), catui.html`${res[1].map(function (t, i) { return catui.html`<a href="search.html?q=${encodeURIComponent(t)}"><span class="Catui_num">${i + 1}</span> ${t}</a>`; })}`);
  });
});
</script>
