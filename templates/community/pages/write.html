<!-- title: 글쓰기 | nav: write | aside: none -->
<form class="Catui_cm-panel" data-catui-cm-editor data-catui-form data-catui-filter="cm-write" novalidate aria-labelledby="wr-t">
  <h1 class="Catui_h2" id="wr-t">글쓰기</h1>
  <div class="Catui_cm-cols">
    <div class="Catui_field"><label class="Catui_label" for="wr-board">게시판</label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="wr-board" name="board"></select>{{icon:chevron-down}}</div></div>
    <div class="Catui_field"><label class="Catui_label" for="wr-cat">말머리</label><div class="Catui_select-wrap"><select class="Catui_input Catui_select" id="wr-cat" name="cat"></select>{{icon:chevron-down}}</div></div>
  </div>
  <div class="Catui_field"><label class="Catui_label" for="wr-title">제목 <span class="Catui_req">필수</span></label><input class="Catui_input" id="wr-title" name="title" maxlength="60" data-catui-counter="60" data-catui-verify="required|minlen:2" data-catui-reqtext="제목을 입력해 주세요." autocomplete="off"></div>
  <div class="Catui_tabs">
    <input class="Catui_clip" type="radio" name="cm-mode" id="wr-m1" value="edit" checked><label class="Catui_tab" for="wr-m1">쓰기</label>
    <div class="Catui_panel Catui_field">
      <label class="Catui_label" for="wr-body">내용 <span class="Catui_req">필수</span></label>
      <div class="Catui_cm-toolbar" role="toolbar" aria-label="서식" aria-controls="wr-body">
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" data-md="bold" aria-label="굵게">{{icon:bold:16}}</button>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" data-md="quote" aria-label="인용">{{icon:quote:16}}</button>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" data-md="list" aria-label="목록">{{icon:list:16}}</button>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button" data-md="link" aria-label="링크">{{icon:link:16}}</button>
      </div>
      <textarea class="Catui_input" id="wr-body" name="body" rows="12" maxlength="5000" data-catui-counter="5000" data-catui-verify="required|minlen:5" data-catui-reqtext="내용을 5자 이상 입력해 주세요." aria-describedby="wr-body-h"></textarea>
      <p class="Catui_help" id="wr-body-h">**굵게** · &gt; 인용 · - 목록 · [글자](https://주소) — 미리보기에서 확인할 수 있어요</p>
    </div>
    <input class="Catui_clip" type="radio" name="cm-mode" id="wr-m2" value="preview"><label class="Catui_tab" for="wr-m2">미리보기</label>
    <div class="Catui_panel"><div class="Catui_cm-preview Catui_cm-prose" data-catui-cm-preview aria-live="polite"></div></div>
  </div>
  <div class="Catui_field">
    <span class="Catui_label" id="wr-pic-l">사진 (10장까지)</span>
    <label class="Catui_upz">{{icon:image}}<span class="Catui_upz-title">사진 고르기</span><span class="Catui_upz-hint">JPG·PNG·WEBP</span><input class="Catui_clip" type="file" accept="image/*" multiple aria-labelledby="wr-pic-l"></label>
    <div class="Catui_cm-pics" data-catui-cm-pics aria-label="고른 사진"></div>
  </div>
  <div class="Catui_cm-savebar">
    <span class="Catui_help" data-catui-cm-saved aria-live="polite"></span>
    <div class="Catui_actions"><button class="Catui_btn Catui_btn-md Catui_btn-ghost" type="reset">지우기</button><button class="Catui_btn Catui_btn-md Catui_btn-primary Catui_cm-write-btn" type="submit">올리기</button></div>
  </div>
</form>
