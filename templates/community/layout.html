<!DOCTYPE html>
<html lang="ko" data-catui-cm-now="2026-11-02T10:00:00+09:00">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} · Catui 커뮤니티</title>
<link rel="icon" href="{{dist}}/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="{{dist}}/catui.min.css">
<link rel="stylesheet" href="{{dist}}/community.min.css">
<!-- 깜빡임 방지: 저장된 테마를 그리기 전에 적용 (CSP로 인라인 스크립트를 막는다면 지워도 됩니다 — catcommunity.js가 곧바로 적용) -->
<script>try{var t=(JSON.parse(localStorage.getItem("catui:community")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body class="Catui_cm-body">
<a class="Catui_skip" href="#cm-main">본문으로 이동</a>
<div class="Catui_site Catui_cm" data-catui-cm data-page="{{page}}"{{rootattrs}}>
  <header class="Catui_cm-head">
    <div class="Catui_cm-head-in">
      <a class="Catui_cm-brand" href="index.html" aria-label="Catui 커뮤니티 홈"><span class="Catui_cm-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M12.5 11.5a4 4 0 1 0 0 5" fill="none" stroke="var(--Catui_card-bg)" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="14" r="1.6" fill="var(--Catui_card-bg)"/><circle cx="24" cy="14" r="1.6" fill="var(--Catui_card-bg)"/></svg></span><b>Catui <span>커뮤니티</span></b></a>
      <form class="Catui_cm-search" action="search.html" role="search" data-catui-cm-search>
        <div class="Catui_search">{{icon:search}}<label class="Catui_clip" for="cm-q">글 검색</label><input class="Catui_input" id="cm-q" name="q" type="search" placeholder="제목·내용·닉네임 검색" autocomplete="off"></div>
      </form>
      <div class="Catui_cm-head-acts">
        <a class="Catui_btn Catui_btn-sm Catui_btn-primary Catui_cm-write-btn" href="write.html">{{icon:pen-line}}글쓰기</a>
        <a class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon Catui_cm-dot" href="search.html" aria-label="검색">{{icon:search:18}}</a>
        <a class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon Catui_cm-dot" href="notifications.html" aria-label="알림 3개">{{icon:bell:18}}<span class="Catui_count" aria-hidden="true">3</span></a>
        <button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-catui-cm-theme aria-label="어두운 화면으로">{{icon:moon:18}}</button>
        <a class="Catui_btn Catui_btn-sm Catui_btn-ghost" href="profile.html" aria-label="내 정보: 산책하는고양이"><span class="Catui_av Catui_av-sm" aria-hidden="true">산</span></a>
      </div>
    </div>
    <nav class="Catui_cm-gnb" aria-label="게시판">
      <div class="Catui_cm-gnb-in">{{gnb}}
        <details class="Catui_dd"><summary class="Catui_btn Catui_btn-sm Catui_btn-ghost">더보기{{icon:chevron-down}}</summary><div class="Catui_dd-menu Catui_dd-sm">{{more}}</div></details>
      </div>
    </nav>
  </header>
  <div class="Catui_cm-wrap">
    <main class="Catui_cm-main" id="cm-main" tabindex="-1">
{{content}}
    </main>
    {{aside}}
  </div>
  <footer class="Catui_cm-foot"><div class="Catui_cm-foot-in"><span>© 2026 Catui 커뮤니티 · Catui {{version}} · MIT License</span><nav aria-label="사이트 정보"><a href="notice.html">공지</a><a href="notice.html#rules">이용 규칙</a><a href="notice.html#privacy">개인정보 처리방침</a></nav></div></footer>
  <button class="Catui_btn Catui_btn-md Catui_btn-secondary Catui_btn-icon Catui_cm-totop" type="button" data-catui-cm-top aria-label="맨 위로" hidden>{{icon:arrow-up:18}}</button>
  <nav class="Catui_cm-tabs" aria-label="빠른 이동">{{tabs}}</nav>
</div>
<script src="{{dist}}/catui.min.js"></script>
<script src="{{dist}}/catcommunity.min.js"></script>
{{scripts}}
</body>
</html>
