<!-- title: 주문 완료 | nav: cart -->
<section class="Catui_sh-done" data-catui-sh-complete>
  <div class="Catui_result Catui_result-success" role="status">
    <span class="Catui_result-icon" aria-hidden="true">{{icon:circle-check:24}}</span>
    <h1 class="Catui_result-title">주문이 완료되었습니다</h1>
    <p class="Catui_result-text">주문 번호 <b class="Catui_num" data-order-no>-</b> · 결제 내역은 이메일로도 보내 드렸습니다.</p>
  </div>
  <section class="Catui_sh-box" aria-labelledby="dn-sum-h">
    <h2 class="Catui_h3" id="dn-sum-h">결제·배송 정보</h2>
    <dl class="Catui_sh-sum" data-order-sum></dl>
  </section>
  <section class="Catui_sh-box" aria-labelledby="dn-items-h">
    <h2 class="Catui_h3" id="dn-items-h">주문 상품</h2>
    <ul class="Catui_sh-co-items" data-order-items></ul>
  </section>
  <div class="Catui_actions Catui_sh-done-acts">
    <a class="Catui_btn Catui_btn-lg Catui_btn-secondary" href="order-track.html" data-track-link>{{icon:truck:18}}배송 조회</a>
    <a class="Catui_btn Catui_btn-lg Catui_btn-secondary" href="orders.html">주문 내역</a>
    <a class="Catui_btn Catui_btn-lg Catui_btn-primary" href="index.html">쇼핑 계속하기</a>
  </div>
</section>
