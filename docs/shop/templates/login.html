<!DOCTYPE html>
<html lang="ko" data-catui-sh-now="2026-11-02T10:00:00+09:00">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Catui 쇼핑</title>
<link rel="icon" href="../../../dist/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="../../../dist/catui.min.css">
<link rel="stylesheet" href="../../../dist/shop.min.css">
<script>try{var t=(JSON.parse(localStorage.getItem("catui:shop")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body class="Catui_sh-body">
<!-- Catui 기본 스타일(리셋·링크·글꼴)은 루트 클래스 안에서만 적용되므로 Catui_site로 감싼다 -->
<div class="Catui_site Catui_sh Catui_sh-blank" data-catui-sh>
<main class="Catui_card Catui_sh-blank-card"><form class="Catui_card-b Catui_vstack Catui_gap-4" id="lg-form" data-catui-form data-catui-filter="sh-login" novalidate>
  <a class="Catui_sh-brand" href="index.html"><span class="Catui_logo" aria-hidden="true"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-shopping-bag"></use></svg></span><b>Catui <span>쇼핑</span></b></a>
  <div><h1 class="Catui_h2">로그인</h1><p class="Catui_help">주문 내역·쿠폰·적립금은 로그인 후 볼 수 있어요</p></div>
  <div class="Catui_banner Catui_banner-danger" role="alert" id="lg-err" hidden><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-alert-circle"></use></svg><span>이메일 또는 비밀번호가 맞지 않습니다. (예제: cat@catui.dev / catui1234)</span></div>
  <div class="Catui_field"><label class="Catui_label" for="lg-mail">이메일</label><input class="Catui_input" id="lg-mail" name="email" type="email" autocomplete="username" value="cat@catui.dev" data-catui-verify="required|email"></div>
  <div class="Catui_field">
  <label class="Catui_label" for="lg-pw">비밀번호</label>
  <div class="Catui_line"><input class="Catui_input" id="lg-pw" name="pw" type="password" autocomplete="current-password" data-catui-verify="required" aria-describedby="lg-pw-help"><button class="Catui_btn Catui_btn-sm Catui_btn-secondary" type="button" data-catui-password-toggle="lg-pw" aria-controls="lg-pw" aria-pressed="false" aria-label="비밀번호 보기"><span data-catui-password-label>보기</span></button></div>
  <p class="Catui_help" id="lg-pw-help">시연용 로그인입니다. 실제 계정의 비밀번호를 입력하지 마세요.</p>
</div>

  <nav class="Catui_actions" aria-label="계정 안내" data-catui-account-links><a class="Catui_link" href="login.html" aria-current="page">로그인 예제</a><a class="Catui_link" href="profile.html">회원 정보</a><a class="Catui_link" href="error-403.html">권한 없음 안내</a></nav>

  <label class="Catui_choice" for="lg-keep"><input class="Catui_clip" type="checkbox" id="lg-keep" name="keep"><span class="Catui_cbx"><svg class="Catui_icon Catui_i12" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-check"></use></svg></span>로그인 상태 유지</label>
  <button class="Catui_btn Catui_btn-lg Catui_btn-primary" type="submit">로그인</button>
  <div class="Catui_divider-text"><span>또는</span></div>
  <div class="Catui_sh-social">
    <button class="Catui_btn Catui_btn-md Catui_btn-secondary" type="button" data-social="카카오"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-message-circle"></use></svg>카카오로 시작하기</button>
    <button class="Catui_btn Catui_btn-md Catui_btn-secondary" type="button" data-social="네이버"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-user-circle"></use></svg>네이버로 시작하기</button>
  </div>
  <p class="Catui_help">처음이신가요? <a class="Catui_link" href="register.html">회원가입</a> · <a class="Catui_link" href="orders.html">비회원 주문 조회</a></p>
</form></main>

</div>
<script src="../../../dist/catui.min.js"></script>
<script src="../../../dist/catshop.min.js"></script>
<script>
catui.use(['form', 'layer'], function (form, layer) {
  form.on('submit(sh-login)', function (d) { var ok = d.field.email === 'cat@catui.dev' && d.field.pw === 'catui1234'; document.getElementById('lg-err').hidden = ok; if (ok) location.href = 'mypage.html'; else document.getElementById('lg-pw').select(); return false; });
  document.getElementById('lg-form').addEventListener('click', function (e) { var b = e.target.closest('[data-social]'); if (b) layer.msg(b.dataset.social + ' 간편 로그인은 예제에서 연결하지 않았습니다'); });
});
</script>
</body>
</html>
