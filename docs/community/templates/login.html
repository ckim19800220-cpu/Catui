<main class="Catui_card Catui_cm-blank-card"><form class="Catui_card-b Catui_vstack Catui_gap-4" id="lg-form" data-catui-form data-catui-filter="cm-login" novalidate>
  <a class="Catui_cm-brand" href="index.html"><span class="Catui_cm-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M12.5 11.5a4 4 0 1 0 0 5" fill="none" stroke="var(--Catui_card-bg)" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="14" r="1.6" fill="var(--Catui_card-bg)"/><circle cx="24" cy="14" r="1.6" fill="var(--Catui_card-bg)"/></svg></span><b>Catui <span>커뮤니티</span></b></a>
  <div><h1 class="Catui_h2">로그인</h1><p class="Catui_help">글쓰기·추천·댓글은 로그인한 회원만 할 수 있어요</p></div>

  <div class="Catui_field"><label class="Catui_label" for="lg-mail">이메일</label><input class="Catui_input" id="lg-mail" name="email" type="email" autocomplete="username" value="cat@catui.dev" data-catui-verify="required|email"></div>

  <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="keep"><span class="Catui_cbx"><svg class="Catui_icon Catui_i12" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-check"></use></svg></span>로그인 상태 유지</label>
  <button class="Catui_btn Catui_btn-lg Catui_btn-primary" type="submit">로그인</button>

<script>
catui.use(['form'], function (form) {

});
