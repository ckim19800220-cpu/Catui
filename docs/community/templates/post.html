<script>
// 글 보기: ?id=글번호 — 머리·숫자는 posts.json, 본문은 post-{id}.json(없으면 요약), 댓글은 comments-1201.json(예시)
catui.use(['util', 'layer'], function (util, layer) {
  var cm = catui.community, id = new URLSearchParams(location.search).get('id') || '1201';
  cm.load().then(function (d) {
    var p = d.byId[id] || d.byId['1201'], href = ({ info: 'board-card.html?b=info', qna: 'qna.html', photo: 'board-gallery.html?b=photo', hotdeal: 'hotdeal.html', notice: 'notice.html' })[p.board] || 'board.html?b=' + p.board;
    document.title = p.title + ' · Catui 커뮤니티';
    var set = function (i, v) { document.getElementById(i).textContent = v; };
    set('pv-title', p.title); set('pv-cat', p.cat); set('pv-views', util.number(p.views)); set('pv-cmts', p.comments); set('pv-score', p.score);
    var bl = document.getElementById('pv-board'); bl.textContent = p.boardName; bl.href = href; document.getElementById('pv-list').href = href;
    catui.mount(document.getElementById('pv-author'), catui.html`${cm.badge(p.author)}<a href="profile.html?u=${p.user}">${p.author.nick}</a>`);
    var t = document.getElementById('pv-time'); t.dateTime = p.time; t.textContent = cm.ago(p.time) + ' · ' + util.toDateString(new Date(p.time), 'yyyy.MM.dd HH:mm');
    document.querySelectorAll('.Catui_cm-gnb a.Catui_hnav-item').forEach(function (a) { if (a.getAttribute('href') === href) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var v = document.getElementById('pv-vote'); v.dataset.catuiCmVote = 'post:' + p.id; v.dataset.up = p.up; v.dataset.down = p.down; cm.vote.paintAll(v.parentElement);
    cm.read.add(p.id);
    // 본문 블록: 문단(p)·사진(img)·인용(quote) — 글자는 모두 이스케이프해서 넣는다
    (p.id === '1201' ? cm.data('post-1201') : Promise.resolve({ body: [{ p: p.summary || '본문 예시입니다. 실서비스는 post-' + p.id + '.json(또는 API)에서 본문을 읽습니다.' }].concat(p.thumb ? [{ img: p.thumb, caption: '주제에 맞춘 공개 라이선스 예시 사진' }] : []), tags: [p.boardName, p.cat] })).then(function (x) {
      catui.mount(document.getElementById('pv-body'), catui.html`${x.body.map(function (b) {
        if (b.img) return catui.html`<figure><img src="${b.img}" alt="${b.caption || ''}" width="640" height="480"><figcaption>${b.caption || ''}</figcaption></figure>`;
        if (b.quote) return catui.html`<blockquote><p>${b.quote}</p></blockquote>`;
        return catui.html`<p>${b.p}</p>`;
      })}`);
      catui.mount(document.getElementById('pv-tags'), catui.html`${(x.tags || []).map(function (g) { return catui.html`<a class="Catui_chip" href="search.html?q=${encodeURIComponent(g)}">#${g}</a>`; })}`);
    });
    var same = d.posts.filter(function (x) { return x.board === p.board; }), i = same.indexOf(p);
    catui.mount(document.getElementById('pv-adj'), catui.html`${[['이전 글', same[i + 1]], ['다음 글', same[i - 1]]].map(function (a) { return catui.html`<li><span>${a[0]}</span>${a[1] ? catui.html`<a href="post.html?id=${a[1].id}">${a[1].title}</a>` : catui.html`<span>없음</span>`}</li>`; })}`);
    catui.mount(document.getElementById('pv-same'), catui.html`${same.filter(function (x) { return x !== p; }).slice(0, 5).map(function (x) { return cm.row(x, { board: false }); })}`);
    var sc = document.getElementById('pv-scrap'), scraps = function () { return cm.store.get('scraps', []); };
    sc.setAttribute('aria-pressed', String(scraps().indexOf(p.id) > -1));
    sc.addEventListener('click', function () { var s = scraps(), on = s.indexOf(p.id) < 0; cm.store.set('scraps', on ? [p.id].concat(s) : s.filter(function (x) { return x !== p.id; })); sc.setAttribute('aria-pressed', String(on)); layer.msg(on ? '스크랩했습니다' : '스크랩을 뺐습니다', { time: 1200 }); });
  });
  document.getElementById('pv-share').addEventListener('click', function () { util.copy(location.href).then(function (ok) { layer.msg(ok ? '주소를 복사했습니다' : '복사하지 못했습니다', { icon: ok ? 'success' : 'warn', time: 1200 }); }); });
  document.getElementById('pv-report').addEventListener('click', function () {
    layer.form({ title: '글 신고', area: 'sm', okText: '신고', fields: [{ name: 'why', label: '사유', type: 'radio', options: ['광고·도배', '욕설·비하', '개인 정보 노출', '기타'], value: '광고·도배' }, { name: 'memo', label: '설명 (선택)', type: 'textarea', rows: 3 }] })
      .then(function (v) { if (v) layer.msg('신고했습니다. 운영진이 확인합니다', { icon: 'success' }); });
  });
});
</script>
