<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 권한 없음 · CatuiAdmin</title>
<link rel="icon" href="../../../dist/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="../../../dist/catui.min.css">
<link rel="stylesheet" href="../../../dist/admin.min.css">
<script>try{var t=(JSON.parse(localStorage.getItem("catui:admin")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body>
<!-- Catui 기본 스타일(리셋·링크·글꼴)은 루트 클래스 안에서만 적용되므로 Catui_site로 감싼다 -->
<div class="Catui_site Catui_adm-blank">
<main class="Catui_adm-error">
  <div class="Catui_vstack Catui_gap-4">
    <span class="Catui_adm-error-code" aria-hidden="true">403</span>
    <div class="Catui_result Catui_result-warning" role="status"><span class="Catui_result-icon"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-lock"></use></svg></span><h1 class="Catui_result-title">이 화면을 볼 권한이 없습니다</h1><p class="Catui_result-text">"정산" 권한이 필요합니다. 최고 관리자에게 권한을 요청하세요.</p>
      <div class="Catui_actions"><a class="Catui_btn Catui_btn-md Catui_btn-primary" href="index.html">대시보드로</a><a class="Catui_btn Catui_btn-md Catui_btn-secondary" href="login.html">다른 계정으로 로그인</a></div></div>
  </div>
</main>
</div>
<script src="../../../dist/catui.min.js"></script>
<script src="../../../dist/catadmin.min.js"></script>

</body>
</html>
