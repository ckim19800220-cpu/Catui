<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · CatuiAdmin</title>
<link rel="icon" href="../../../dist/../assets/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="../../../dist/catui.min.css">
<link rel="stylesheet" href="../../../dist/admin.min.css">
<script>try{var t=(JSON.parse(localStorage.getItem("catui:admin")||"{}").theme)||"system";if(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-catui-theme","dark")}catch(e){}</script>
</head>
<body class="Catui_adm-body">
<!-- Catui 기본 스타일(리셋·링크·글꼴)은 루트 클래스 안에서만 적용되므로 Catui_site로 감싼다 -->
<div class="Catui_site Catui_adm-blank">
<div class="Catui_adm-auth">
  <aside class="Catui_adm-auth-brand" aria-label="소개">
    <p class="Catui_line"><span class="Catui_logo">C</span><b>CatuiAdmin</b></p>
    <div><h2>오늘의 주문과 재고를<br>한 화면에서.</h2><p>Catui 위에 만든 한국어 관리자 템플릿 — 접근성 AA · 다크 모드 · 키보드 조작</p></div>
    <p class="Catui_help">© 2026 CatuiAdmin</p>
  </aside>
  <main class="Catui_adm-auth-main">
    <form class="Catui_adm-auth-card" id="lg-form" data-catui-form data-catui-filter="lg-form" novalidate>
      <div><h1 class="Catui_h1">로그인</h1><p class="Catui_help">관리자 계정으로 들어갑니다</p></div>
      <div class="Catui_banner Catui_banner-danger" role="alert" id="lg-err" hidden><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-alert-circle"></use></svg><span>이메일 또는 비밀번호가 맞지 않습니다. (예제: admin@catui.dev / catui1234)</span></div>
      <div class="Catui_field"><label class="Catui_label" for="lg-mail">이메일</label><input class="Catui_input" id="lg-mail" name="email" type="email" autocomplete="username" data-catui-verify="required|email" value="admin@catui.dev"></div>
      <div class="Catui_field"><label class="Catui_label" for="lg-pw">비밀번호</label>
        <div class="Catui_adm-pw"><input class="Catui_input" id="lg-pw" name="pw" type="password" autocomplete="current-password" data-catui-verify="required" aria-describedby="lg-caps"><button class="Catui_btn Catui_btn-sm Catui_btn-ghost Catui_btn-icon" type="button" data-catui-adm-pwtoggle aria-label="비밀번호 보기"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-eye"></use></svg></button></div>
        <p class="Catui_adm-caps" id="lg-caps" data-catui-adm-caps="#lg-pw" hidden><svg class="Catui_icon Catui_i12" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-alert-triangle"></use></svg>Caps Lock이 켜져 있습니다</p></div>
      <div class="Catui_adm-auth-row">
        <label class="Catui_choice"><input class="Catui_clip" type="checkbox" name="keep"><span class="Catui_cbx"><svg class="Catui_icon Catui_i12" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-check"></use></svg></span>로그인 상태 유지</label>
        <a class="Catui_link" href="forgot.html">비밀번호를 잊으셨나요?</a>
      </div>
      <button class="Catui_btn Catui_btn-lg Catui_btn-primary" type="submit" data-catui-submit>로그인</button>
      <p class="Catui_adm-auth-alt">또는</p>
      <button class="Catui_btn Catui_btn-lg Catui_btn-secondary" type="button" id="lg-sso"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="../../../dist/icons.svg?v=2#Catui_ic-key"></use></svg>회사 계정(SSO)으로 로그인</button>
      <p class="Catui_help">계정이 없나요? <a class="Catui_link" href="register.html">가입 신청</a></p>
    </form>
  </main>
</div>

</div>
<script src="../../../dist/catui.min.js"></script>
<script src="../../../dist/catadmin.min.js"></script>
<script>
catui.use(['form', 'layer'], function (form, layer) {
  // 템플릿에는 SSO 서버가 없으므로 눌렀을 때 안내만(무반응 버튼 방지)
  document.getElementById('lg-sso').addEventListener('click', function () { layer.msg('SSO는 실서비스에서 회사 인증 서버와 연결하면 열립니다', { icon: 'info' }); });
  form.on('submit(lg-form)', function (d) {
    var ok = d.field.email === 'admin@catui.dev' && d.field.pw === 'catui1234';
    document.getElementById('lg-err').hidden = ok;
    if (ok) location.href = 'index.html'; else document.getElementById('lg-pw').select();
    return false;
  });
});
</script>
</body>
</html>
