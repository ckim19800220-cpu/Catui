<section aria-labelledby="usage">
<h2 id="usage">사용법</h2>
<p><code>.Catui_heat-grid</code>에 셀 <code>i.Catui_heat-1~5</code>를 채웁니다. 범례는 <code>.Catui_heat-legend</code>.</p>
</section>

<section aria-labelledby="a11y">
<h2 id="a11y">접근성</h2>
<ul>
  <li>색 농도만으로 값을 전하지 않습니다 — 칸마다 <code>title</code>, 전체 요약 <code>aria-label</code>.</li>
  <li>범례는 적음 → 많음 순.</li>
</ul>
</section>
