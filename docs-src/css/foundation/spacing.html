<section aria-labelledby="space">
<h2 id="space">간격</h2>
<p>간격은 4px 배수 10단계입니다. 컴포넌트 안은 작은 단계, 컴포넌트 사이는 <code>--Catui_grid-gap</code>(20), 화면 가장자리는 <code>--Catui_content-pad</code>(24)를 씁니다.</p>
<catui-tokens match="^space-"></catui-tokens>
</section>

<section aria-labelledby="radius">
<h2 id="radius">반경</h2>
<catui-tokens match="^radius-"></catui-tokens>
</section>

<section aria-labelledby="shadow">
<h2 id="shadow">그림자</h2>
<p>카드는 <code>xs</code>, 드롭다운·팝오버는 <code>md</code>까지. 카드 안에 md 이상 그림자를 겹치지 않습니다.</p>
<catui-tokens match="^shadow-"></catui-tokens>
</section>

<section aria-labelledby="control">
<h2 id="control">컨트롤 높이</h2>
<catui-tokens match="^control-h-"></catui-tokens>
</section>
