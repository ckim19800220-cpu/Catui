<section aria-labelledby="usage">
<h2 id="usage">쓰는 법</h2>
<p>색은 항상 변수로 씁니다. 텍스트·포커스는 AA를 넘는 <code>brand-strong</code>·<code>text-primary/secondary</code>를, 배경·장식은 <code>brand</code>·<code>*-soft</code>를 씁니다.</p>
<catui-example title="상태 색 조합">
  <div class="Catui_actions">
    <span class="Catui_pill Catui_pill-success"><i class="Catui_dot"></i>완료</span>
    <span class="Catui_pill Catui_pill-info"><i class="Catui_dot"></i>처리</span>
    <span class="Catui_pill Catui_pill-warning"><i class="Catui_dot"></i>대기</span>
    <span class="Catui_pill Catui_pill-danger"><i class="Catui_dot"></i>취소</span>
  </div>
</catui-example>
</section>

<section aria-labelledby="palette">
<h2 id="palette">팔레트 토큰</h2>
<catui-tokens match="^color-"></catui-tokens>
</section>

<section aria-labelledby="chart">
<h2 id="chart">차트 시리즈</h2>
<p>차트는 시리즈 5색을 순서대로 씁니다. 한 차트에 5색이 넘지 않게 합니다.</p>
<catui-tokens match="^chart-series-"></catui-tokens>
</section>
