<section aria-labelledby="scale">
<h2 id="scale">크기 단계</h2>
<catui-example title="제목과 본문">
  <p class="Catui_display">표시 30</p>
  <p class="Catui_h1">제목 1 · 24</p>
  <p class="Catui_h2">제목 2 · 18</p>
  <p class="Catui_h3">제목 3 · 15</p>
  <p class="Catui_h4">제목 4 · 13 굵게</p>
  <p>본문 13 · 줄 높이 1.55, 한국어 줄바꿈은 단어 단위(keep-all)입니다.</p>
  <p class="Catui_lead">도입문은 본문보다 조금 크고 옅습니다.</p>
  <p class="Catui_metric">5,400</p>
  <p class="Catui_metric-lg">1,280 <span class="Catui_help">(metric-lg 22)</span></p>
</catui-example>
<p>숫자 열·카운터에는 <code>.Catui_num</code>(고정폭 숫자)을 붙입니다. 글꼴 파일은 필수가 아닙니다 — <code>--Catui_font-ui</code>에 Inter 다음 한글 시스템 글꼴이 있습니다.</p>
</section>

<section aria-labelledby="tokens">
<h2 id="tokens">타이포 토큰</h2>
<catui-tokens match="^(font-|type-)"></catui-tokens>
</section>
