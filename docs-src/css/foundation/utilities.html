<section aria-labelledby="list">

<div class="doc-table-wrap"><table class="Catui_tbl"><caption class="Catui_clip">유틸리티 클래스</caption>
<thead><tr><th scope="col">클래스</th><th scope="col">용도</th></tr></thead>
<tbody>
<tr><td><code>.Catui_clip</code></td><td>화면에서 숨기고 화면 낭독기에는 읽힘 (숨긴 input, 보조 문구)</td></tr>
<tr><td><code>.Catui_skip</code></td><td>"본문으로 이동" 건너뛰기 링크 — 포커스 시 나타남</td></tr>
<tr><td><code>.Catui_num</code></td><td>고정폭 숫자</td></tr>
<tr><td><code>.Catui_actions</code></td><td>가로 정렬 묶음(버튼 줄). 안에 <code>.Catui_h1</code>이 있으면 버튼을 오른쪽 끝으로</td></tr>
<tr><td><code>.Catui_line</code></td><td>아이콘 + 글자 한 줄</td></tr>
<tr><td><code>.Catui_icon</code> · <code>.Catui_i12~20</code></td><td>아이콘 크기</td></tr>
</tbody></table></div>
