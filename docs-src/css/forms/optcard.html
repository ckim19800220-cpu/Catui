<section aria-labelledby="radio">
<h2 id="radio">하나 고르기</h2>
<catui-example title="요금제 (radio)">
  <fieldset class="Catui_optcards"><legend class="Catui_label">요금제</legend>
    <input class="Catui_clip" type="radio" name="oc-plan" id="oc-free"><label class="Catui_optcard" for="oc-free"><span class="Catui_optcard-title">시작</span><span class="Catui_optcard-text">개인 · 프로젝트 1개</span><span class="Catui_optcard-price">무료</span></label>
    <input class="Catui_clip" type="radio" name="oc-plan" id="oc-team" checked><label class="Catui_optcard" for="oc-team"><span class="Catui_optcard-title">팀</span><span class="Catui_optcard-text">10명 · 프로젝트 무제한</span><span class="Catui_optcard-price">월 29,000원</span></label>
    <input class="Catui_clip" type="radio" name="oc-plan" id="oc-ent" disabled><label class="Catui_optcard" for="oc-ent"><span class="Catui_optcard-title">회사</span><span class="Catui_optcard-text">상담 후 가입 (현재 불가)</span><span class="Catui_optcard-price">문의</span></label>
  </fieldset>
</catui-example>
</section>
<section aria-labelledby="delivery">
<h2 id="delivery">배송 방법</h2>
<catui-example title="아이콘이 있는 카드">
  <fieldset class="Catui_optcards"><legend class="Catui_label">배송</legend>
    <input class="Catui_clip" type="radio" name="oc-ship" id="oc-std" checked><label class="Catui_optcard" for="oc-std"><span class="Catui_optcard-title Catui_line"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="{{dist}}/icons.svg?v=2#Catui_ic-inbox"></use></svg>일반 배송</span><span class="Catui_optcard-text">2~3일 · 무료</span></label>
    <input class="Catui_clip" type="radio" name="oc-ship" id="oc-fast"><label class="Catui_optcard" for="oc-fast"><span class="Catui_optcard-title Catui_line"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="{{dist}}/icons.svg?v=2#Catui_ic-arrow-right"></use></svg>빠른 배송</span><span class="Catui_optcard-text">내일 도착 · 3,000원</span></label>
  </fieldset>
</catui-example>
</section>
<section aria-labelledby="usage">
<h2 id="usage">사용법</h2>
<p><code>fieldset.Catui_optcards</code> 안에 <code>input.Catui_clip</code> + <code>label.Catui_optcard</code>(<code>-title</code>·<code>-text</code>·<code>-price</code>)를 짝으로 둡니다. 오른쪽 위 원이 선택 표시가 됩니다. 여러 개를 고르게 하려면 checkbox로 바꾸면 됩니다.</p>
</section>
<section aria-labelledby="a11y">
<h2 id="a11y">접근성</h2>
<ul>
  <li>실제 radio라 화살표 키로 고르고, 묶음 이름은 <code>legend</code>.</li>
  <li>선택은 테두리·배경·원 표시를 함께 바꿉니다. 불가 항목은 <code>disabled</code>와 이유를 글자로.</li>
</ul>
</section>
