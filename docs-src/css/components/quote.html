<section aria-labelledby="basic">
<h2 id="basic">인용</h2>
<catui-example title="본문 인용 + 출처">
  <figure>
    <blockquote class="Catui_quote"><p>토큰 이름만 지키면 화면 두 벌이 같은 모양을 유지합니다.</p><cite class="Catui_quote-cite">Catui 디자인 원칙</cite></blockquote>
  </figure>
</catui-example>
<catui-example title="강조 인용 (quote-lg)">
  <blockquote class="Catui_quote Catui_quote-lg"><p>“설정 화면을 하루 만에 다시 만들었습니다.”</p><cite class="Catui_quote-cite">김하늘, 프로덕트 디자이너</cite></blockquote>
</catui-example>
</section>

<section aria-labelledby="usage">
<h2 id="usage">사용법</h2>
<p><code>blockquote.Catui_quote</code> 안에 문장 <code>p</code>와 출처 <code>cite.Catui_quote-cite</code>(앞에 줄표 자동). 고객 후기·핵심 문장 강조는 <code>.Catui_quote-lg</code>. 글 영역 안이라면 <a href="doc:css/charts/prose">본문</a>의 <code>blockquote</code>가 같은 역할을 합니다.</p>
</section>

<section aria-labelledby="a11y">
<h2 id="a11y">접근성</h2>
<ul>
  <li>인용은 <code>blockquote</code>로 만들어 인용임이 읽히게 하고, 출처는 글자로 둡니다.</li>
  <li>왼쪽 선은 장식이며 색만으로 인용을 구분하지 않습니다.</li>
</ul>
</section>
