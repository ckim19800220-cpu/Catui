<section aria-labelledby="tooltip">
<h2 id="tooltip">툴팁</h2>
<catui-example title="순수 힌트 (navy 배경 · 11px)">
  <div class="Catui_actions">
    <button class="Catui_btn Catui_btn-md Catui_btn-ghost" type="button" aria-label="내보내기" aria-describedby="tt-demo"><svg class="Catui_icon Catui_i16" aria-hidden="true"><use href="{{dist}}/icons.svg?v=2#Catui_ic-download"></use></svg></button>
    <span class="Catui_tooltip" role="tooltip" id="tt-demo">CSV로 내보냅니다</span>

</section>

<section aria-labelledby="popover">
<h2 id="popover">팝오버</h2>
<catui-example title="화살표 7px + md 그림자, 버튼 포함 가능">
  <div class="Catui_popover"><p><b>이번 주 기준</b></p><p class="Catui_help">월요일 0시부터 집계합니다.</p><button class="Catui_btn Catui_btn-sm Catui_btn-ghost" type="button">자세히</button></div>
</catui-example>
</section>

<section aria-labelledby="usage">
<h2 id="usage">사용법</h2>
<p><code>.Catui_tooltip</code>은 짧은 힌트 글자만, 버튼·링크가 필요하면 <code>.Catui_popover</code>를 씁니다. 위치와 열고 닫기는 브라우저 Popover API(<code>popover</code> 속성)나 스크립트로 붙입니다 — 이 클래스들은 모양만 맡습니다.</p>
</section>

<section aria-labelledby="a11y">
<h2 id="a11y">접근성</h2>
<ul>
  <li>툴팁은 hover와 키보드 포커스 모두에서 보이고, 대상과 <code>aria-describedby</code>로 연결합니다.</li>
  <li>툴팁 안에 버튼·링크를 넣지 않습니다 — 필요하면 팝오버.</li>
</ul>
</section>
