<section aria-labelledby="a11y">
<h2 id="a11y">접근성</h2>
<ul>
  <li><code>nav aria-label="현재 위치"</code>, 현재 항목은 링크가 아닌 <code>aria-current="page"</code>.</li>
  <li>구분선은 장식이므로 스크린리더에서 숨겨도 됩니다(<code>aria-hidden</code>).</li>
</ul>
</section>
